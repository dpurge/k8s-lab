# The models the dev cluster's assistant uses: the same as phraseforge's dev
# cluster, the Ollama on the laptop that runs the cluster, reached from a pod as
# host.docker.internal. This is the committed default. The GPU machine, Vertex AI
# and OpenRouter are the prod cluster's (see models.example.yaml); `task llm-enable`
# generates a copy with extra providers in .k3d/llm/ (git-ignored), which the deploy
# tasks then use instead of this file. Deployed as the assistant-models ConfigMap
# by `task deploy-assistant`; check it with
#   go run . models validate models.dev.yaml
providers:
  - id: ollama
    type: ollama
    base_url: http://host.docker.internal:11434
    api_key_from: ""
  # Answers the hello workflow from inside the assistant, with no load, to try the
  # interface by hand. It refuses every other workflow.
  - id: demo
    type: demo

models:
  # Phraseforge's model, with the tags the assistant's workflows ask for: default
  # (as in phraseforge), chat and review.
  - id: gemma4-12b
    provider: ollama
    model: gemma4:12b
    tags: [default, chat, review, cheap]
    priority: 10
    # The laptop is CPU-bound: allow for a model load, then stop waiting when
    # output has stalled.
    options:
      num_ctx: 8192
      num_predict: 512
      think: false
      first_token_timeout_seconds: 300
      idle_timeout_seconds: 60
      overall_timeout_seconds: 600
  # The same model with room for an interface: a form in A2UI is several times
  # longer than a chat reply, so the output is not cut at 512 tokens. Only
  # workflows that ask for the tag ui (ui-compose) use it.
  - id: gemma4-12b-ui
    provider: ollama
    model: gemma4:12b
    tags: [ui]
    priority: 10
    options:
      num_ctx: 8192
      num_predict: 2048
      think: false
      first_token_timeout_seconds: 300
      idle_timeout_seconds: 90
      overall_timeout_seconds: 900
  # The demo model also plays the orchestrator (it routes by keywords), so that
  # routing and delegation can be tried without loading the laptop; give the tag
  # orchestrator to a real model instead to see a model route.
  - id: demo-hello
    provider: demo
    model: hello
    tags: [demo, orchestrator]
    priority: 1

routing:
  breaker:
    failures: 3
    cooldown_seconds: 60
    rate_limited_cooldown_seconds: 30
