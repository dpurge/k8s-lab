id: ui-compose
version: 1
description: You say in words what to ask or collect; a model writes it as an interface (a small form), you fill it in, and the model says back what it received. Tries a model composing interfaces; needs a model that can write JSON well.
intents:
  description: Writes a small form for something the user wants to ask or collect, shows it, and says back what was entered.
  examples: ["make a form that asks for my name and email", "I need a quick poll with three options"]
state_schema:
  type: object
  properties:
    request: {type: string, description: "What the user wants to ask or collect, as they said it."}
    received: {type: object, description: "The context of the button the user pressed: the values they entered."}
    summary: {type: string, description: "One or two sentences saying what the user entered."}
  required: [summary]
  additionalProperties: false
start: compose
limits: {max_steps: 6, max_tokens: 30000, max_retries: 2, max_visits: 3}
model_tags: [ui]
ui:
  catalogs: [basic]
states:
  compose:
    instructions: >-
      The observation decides what you do. If it is a text, the user has just
      said what to ask or collect and has entered nothing yet: record it in
      request and reply with the ask_user action, whose payload has a short
      "question" and the interface under "ui" (see INTERFACES), with the inputs
      the request needs and one Button. Never use the goto action for a text
      observation. Only if the observation is an object with "ui_action" has the
      user pressed the button: record its context in received and go to
      summarise.
    next: [summarise]
    on_error: plain
  plain:
    instructions: >-
      The interface could not be built, so ask in plain words instead. If the
      observation is an object with "error", the user's request is the text under
      its "observation": record it in request if it is not recorded yet, and reply
      with the ask_user action whose payload is only {"question": "<the request,
      asked as one short plain question>"}, never with a "ui". If the observation
      is a text, it is the user's answer: record it in received as {"answer":
      "<the text>"} and go to summarise.
    next: [summarise]
  summarise:
    instructions: >-
      Write one or two sentences saying what the user entered, using the values
      in received, record them in summary and go to done.
    next: [done]
  done:
    instructions: Finished.
    end: true
