<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Assistant</title>
    <script src="/ui/theme-init.js" data-key="as"></script>
    <link rel="stylesheet" href="/ui/tokens.css" />
    <link rel="stylesheet" href="/static/app.css" />
    <script src="/static/format.js"></script>
    <script src="/static/api.js"></script>
    <script src="/static/components/as-new-task/component.js"></script>
    <script src="/static/components/as-task-list/component.js"></script>
    <script src="/static/components/as-chat-list/component.js"></script>
    <script src="/static/components/as-chat-thread/component.js"></script>
    <script src="/static/components/as-task-actions/component.js"></script>
    <script src="/static/components/as-answer-box/component.js"></script>
    <script src="/static/components/as-run-trace/component.js"></script>
    <script src="/static/components/as-task-detail/component.js"></script>
    <script src="/static/components/as-usage/component.js"></script>
    <script src="/static/components/as-model-list/component.js"></script>
    <script src="/static/components/as-attempts/component.js"></script>
    <script type="module" src="/ui/dp-core.js"></script>
    <script src="/static/app.js"></script>
  </head>
  <body>
    <dp-shell storage-key="as" theme-toggle theme-label="Toggle theme">
      <a slot="brand" class="brand" href="#/tasks">Assistant</a>
      <dp-tabs
        slot="header"
        id="mainNav"
        variant="underline"
        label="Main"
        active="tasks"
        items='[{"id":"chat","label":"Chat","href":"#/chat"},{"id":"tasks","label":"Tasks","href":"#/tasks"},{"id":"usage","label":"Usage","href":"#/usage"}]'
      ></dp-tabs>
      <div id="view"></div>
      <dp-status-bar slot="footer" id="statusBar"></dp-status-bar>
    </dp-shell>
  </body>
</html>
