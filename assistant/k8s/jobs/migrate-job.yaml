---
apiVersion: batch/v1
kind: Job
metadata:
  name: assistant-migrate
  namespace: app
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: migrate
          image: k8s-lab-registry:5000/assistant:dev
          imagePullPolicy: Always
          command: ["/assistant", "migrate"]
          env:
            - name: ASSISTANT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: assistant-database
                  key: ASSISTANT_DATABASE_URL
