openapi: 3.1.0
info:
  title: Assistant API
  version: 0.1.0
  description: >-
    The assistant's task queue. Tasks name the workflow to run and the user it
    runs for. Errors are always {"error": {"code", "message"}}. There is no
    authentication yet; it will come from a shared external service.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Health of the service
      description: 200 only when the database answers, otherwise 503.
      responses:
        "200":
          description: The database answered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: The database did not answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics
      responses:
        "200":
          description: Metrics in the Prometheus text exposition format.
          content:
            text/plain:
              schema: { type: string }
  /:
    get:
      operationId: getAdminPage
      summary: The admin interface
      description: >-
        The admin interface is a single-page app of static files embedded in the
        server. This is its page; its files are under /static/. It calls only
        the /api/v1 operations below. Responses carry a strict
        Content-Security-Policy.
      responses:
        "200":
          description: The page.
          content:
            text/html: { schema: { type: string } }
  /admin:
    get:
      operationId: redirectAdmin
      summary: Redirect from the former admin address to /
      responses:
        "301":
          description: Moved to /.
  /admin/:
    get:
      operationId: redirectAdminSlash
      summary: Redirect from the former admin address to /
      responses:
        "301":
          description: Moved to /.
  /a2ui-config.json:
    get:
      operationId: getA2uiConfig
      summary: Settings the chat interface needs to draw A2UI surfaces
      description: >-
        The hosts the page's Content-Security-Policy lets interfaces load
        images, video and audio from, besides this server and data: URLs
        (ASSISTANT_A2UI_MEDIA_HOSTS; none by default). The renderer uses it to
        explain a blocked image; the policy is what enforces it.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                type: object
                required: [media_hosts]
                properties:
                  media_hosts:
                    type: array
                    items: { type: string }
  /static/{path}:
    get:
      operationId: getAdminAsset
      summary: A file of the admin interface
      description: >-
        A script or stylesheet of the admin interface page, embedded in the
        server. Responses carry a strict Content-Security-Policy.
      parameters:
        - name: path
          in: path
          required: true
          description: The file's path under /static/.
          allowReserved: true
          schema: { type: string }
      responses:
        "200":
          description: The file.
          content:
            text/html: { schema: { type: string } }
            text/javascript: { schema: { type: string } }
            text/css: { schema: { type: string } }
        "404":
          description: No such file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /ui/{path}:
    get:
      operationId: getSharedUiAsset
      summary: A file of the shared component library
      description: >-
        The Lit components (dp-*) and design tokens that the admin interface
        shares with the other apps, built from shared/ui and embedded in the
        server. The bundle is dp-core.js; chunks under chunks/ have a content
        hash in their name and are cached for good, everything else is
        revalidated.
      parameters:
        - name: path
          in: path
          required: true
          description: The file's path under /ui/.
          allowReserved: true
          schema: { type: string }
      responses:
        "200":
          description: The file.
          content:
            text/javascript: { schema: { type: string } }
            text/css: { schema: { type: string } }
        "404":
          description: No such file.
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List users, oldest first
      responses:
        "200":
          description: Every user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewUser" }
      responses:
        "201":
          description: The user was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "409":
          description: Another user already has this telegram_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/tasks:
    delete:
      operationId: removeTasks
      summary: Delete every task in one finished status
      description: Running and waiting tasks are never removed in bulk.
      parameters:
        - name: status
          in: query
          required: true
          schema: { enum: [succeeded, failed, cancelled] }
      responses:
        "200":
          description: How many tasks were deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Removed" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      operationId: listTasks
      summary: List tasks, newest first
      parameters:
        - name: status
          in: query
          description: Keep only tasks in this status.
          schema: { $ref: "#/components/schemas/TaskStatus" }
        - name: limit
          in: query
          description: Page size.
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: offset
          in: query
          description: How many tasks to skip.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page of tasks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createTask
      summary: Queue a task
      description: The task's source is set to "api" and its status to "pending".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewTask" }
      responses:
        "201":
          description: The task was queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404":
          description: There is no user with that user_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/tasks/{id}:
    delete:
      operationId: removeTask
      summary: Delete a task and its trace
      description: The model calls it made are kept without a task, so usage and cost do not change.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: The task was deleted. }
        "404":
          description: There is no task with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The task is running; cancel it first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      operationId: getTask
      summary: Get one task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404":
          description: There is no task with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/tasks/{id}/cancel:
    post:
      operationId: cancelTask
      summary: Cancel a pending, waiting or running task
      description: >-
        A pending or waiting task is cancelled at once (200). A running task is
        told to stop and ends as cancelled within moments (202).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The task, now cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "202":
          description: The running task was told to stop.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404":
          description: There is no task with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The task is not pending, waiting or running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/tasks/{id}/retry:
    post:
      operationId: retryTask
      summary: Queue a copy of a failed or cancelled task
      description: Same user, workflow, source and payload; the original stays.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: The new task, pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404":
          description: There is no task with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Only a failed or cancelled task can be retried.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/tasks/{id}/messages:
    post:
      operationId: answerTask
      summary: Answer a task whose run is waiting for the user
      description: >-
        Queues the task again with the answer; the worker resumes the run with
        it. Answers at once, the run goes on in the background.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewMessage" }
      responses:
        "200":
          description: The task, queued again as pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404":
          description: There is no task with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The task is not waiting for an answer, or has been answered already.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/tasks/{id}/steps:
    get:
      operationId: listTaskSteps
      summary: The trace of a task's workflow run, oldest first
      description: One item per attempt of a step, including refused replies, with the model's raw reply cut at 8 KB.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The steps; empty if the task has no workflow run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepList" }
        "404":
          description: There is no task with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/tasks/{id}/llm-calls:
    get:
      operationId: listTaskCalls
      summary: List the model calls a task made, oldest first
      description: One item per attempt, so a fallback shows the failed attempt and the one that answered. Calls are kept for a limited period (90 days by default, ASSISTANT_LLM_CALLS_RETENTION_DAYS), so the history of an older task may be empty or incomplete.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The task's attempts; empty if it made none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallList" }
        "404":
          description: There is no task with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/llm-calls:
    get:
      operationId: listAttempts
      summary: List every model call, newest first, a page at a time
      description: One item per attempt, failed ones included, so it is the record behind the usage figures. Calls are kept for a limited period (90 days by default, ASSISTANT_LLM_CALLS_RETENTION_DAYS).
      parameters:
        - name: since
          in: query
          description: Keep only calls that started at or after this time.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          description: Page size.
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
        - name: offset
          in: query
          description: How many calls to skip.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page of attempts; empty if there are none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttemptList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/usage:
    get:
      operationId: getUsage
      summary: Tokens, cost and calls by user, provider and model
      description: Counts successful calls only; a failed attempt has no tokens and no cost. Highest cost first. Covers only the retained period of the call history (90 days by default, ASSISTANT_LLM_CALLS_RETENTION_DAYS), so a since earlier than that returns no more than the retained calls.
      parameters:
        - name: since
          in: query
          description: Count only calls that started at or after this time.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: One item per user, provider and model that was used.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/conversations:
    get:
      operationId: listConversations
      summary: List conversations, the most recently active first
      parameters:
        - name: user_id
          in: query
          description: Keep only this user's conversations.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The conversations, each with the state of its run and the last words.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationList" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createConversation
      summary: Start a conversation with a workflow
      description: The workflow must be a YAML workflow, or ask. Nothing runs until the user writes a message.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewConversation" }
      responses:
        "201":
          description: The conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404":
          description: There is no user with that user_id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/conversations/{id}:
    get:
      operationId: getConversation
      summary: Get one conversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "404":
          description: There is no conversation with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: removeConversation
      summary: Delete a conversation and its messages
      description: Its run is cancelled first (a run that already finished needs no cancel); the task record and its trace stay. If the run cannot be cancelled the answer is 500 and the conversation is not deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: The conversation was deleted. }
        "404":
          description: There is no conversation with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/conversations/{id}/messages:
    get:
      operationId: listChatMessages
      summary: What was said, in order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: after
          in: query
          description: Only messages with a greater id, which is how a page asks for what is new.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: The messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessageList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404":
          description: There is no conversation with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: sendChatMessage
      summary: Say something in a conversation
      description: >-
        A message starting with / is a command (/help) and is answered at once.
        Any other text is the answer to the question the run is waiting on, or
        the first message of a new run. The assistant's reply comes later as
        messages of its own. While a run is working a new message is refused (409).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewChatMessage" }
      responses:
        "201":
          description: The stored message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404":
          description: There is no conversation with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The assistant is still working on the previous message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The message was stored but the run could not be started or answered; the conversation says why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/conversations/{id}/ui-events:
    post:
      operationId: postChatUiEvent
      summary: Tell the assistant what happened in an interface it drew
      description: >-
        The body is one A2UI v1.0 renderer-to-agent message, validated against the
        protocol's schema. An action (the user pressed a button) must come from a
        component of a surface this conversation drew; it is stored as a ui_action
        message, shown as the user's turn (its userMessage, else its name), and given
        to the run as the answer to the question it waits on, or as the first message
        of a new run, in the form {"ui_action": <the action>}. An error the page
        reports is stored as a ui_action message and does not reach the run. A
        callAgentFunction (the page asks the assistant for a function of its own
        catalog, listWorkflows) is stored, answered in the conversation with an
        agentFunctionResponse as an interface message, and does not move the run; its
        call id must be new, its surface must exist, and the calls per turn are
        limited. A rendererFunctionResponse is the answer to a function the run asked
        the page to run; it must match a call that is still waiting (an answer is
        taken once, and a call not answered in time is answered with a TIMEOUT error
        by the assistant), and it reaches the run as {"ui_function_response": ...}.
        An action may carry the values the user entered, in its metadata under the
        extension assistant_data_model, which the page puts back when the
        conversation is opened again.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { const: v1.0 }
      responses:
        "201":
          description: The stored message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "400":
          description: The message is not valid A2UI, names a surface or component this conversation does not have, reuses a call id, answers a call that is not waiting, or makes too many calls.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: There is no conversation with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The assistant is still working on the previous message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The event was stored but the run could not be started or answered; the conversation says why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/workflows:
    get:
      operationId: listWorkflows
      summary: The workflows a task can name
      responses:
        "200":
          description: Built-in and YAML workflows, by id, each with a payload to start from.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowList" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/models:
    get:
      operationId: listModels
      summary: List the configured models and whether each is available now
      description: Never includes the address of a provider, nor the name or location of a credential.
      responses:
        "200":
          description: The models, in the order of the models file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        "500": { $ref: "#/components/responses/Internal" }
components:
  responses:
    InvalidRequest:
      description: The request is malformed or a field is missing or invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: Something went wrong on the server. The details are in its log.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { enum: [ok, unavailable] }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { enum: [invalid_request, not_found, conflict, internal] }
            message: { type: string }
    User:
      type: object
      additionalProperties: false
      required: [id, telegram_id, display_name, created_at]
      properties:
        id: { type: string, format: uuid }
        telegram_id: { type: [integer, "null"] }
        display_name: { type: string, minLength: 1 }
        created_at: { type: string, format: date-time }
    NewUser:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1 }
        telegram_id: { type: [integer, "null"] }
    UserList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
    TaskStatus:
      enum: [pending, running, waiting, succeeded, failed, cancelled]
    TaskSource:
      enum: [telegram, nats, scheduler, api]
    Task:
      type: object
      additionalProperties: false
      required:
        - id
        - user_id
        - workflow_id
        - source
        - status
        - payload
        - result
        - error
        - created_at
        - started_at
        - finished_at
        - queue_seconds
        - execution_seconds
        - usage
        - run
        - ask
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        workflow_id: { type: string, minLength: 1 }
        source: { $ref: "#/components/schemas/TaskSource" }
        status: { $ref: "#/components/schemas/TaskStatus" }
        payload: { type: object }
        result:
          description: What the workflow returned; null until the task has finished.
          type: [object, "null"]
        error:
          description: Why the task failed; null otherwise.
          type: [string, "null"]
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        queue_seconds:
          description: Time spent waiting for a worker; so far, if it has not started.
          type: number
          minimum: 0
        execution_seconds:
          description: Time spent running; so far, if it has not finished; null before it starts.
          type: [number, "null"]
          minimum: 0
        usage: { $ref: "#/components/schemas/TaskUsage" }
        run:
          description: The workflow run's snapshot (state, run state, steps, tokens); null until a workflow has run, and always null in the list.
          type: [object, "null"]
        ask:
          description: What a waiting run asked the user (the ask_user payload); null otherwise.
          type: [object, "null"]
    NewConversation:
      type: object
      additionalProperties: false
      required: [user_id, workflow_id]
      properties:
        user_id: { type: string, format: uuid }
        workflow_id: { type: string, minLength: 1 }
        title: { type: string }
    Conversation:
      type: object
      additionalProperties: false
      required: [id, user_id, workflow_id, title, task_id, created_at, task_status, task_error, last_text, last_at, messages]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        workflow_id: { type: string }
        title: { type: string }
        task_id:
          description: The run the conversation is in; null before the first message or after the run was removed.
          type: [string, "null"]
          format: uuid
        created_at: { type: string, format: date-time }
        task_status:
          description: The state of that run; null if there is none.
          type: [string, "null"]
        task_error: { type: [string, "null"] }
        last_text:
          description: The last message, cut to 140 characters; null if nothing was said.
          type: [string, "null"]
        last_at: { type: string, format: date-time }
        messages: { type: integer, minimum: 0 }
    ConversationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Conversation" }
    NewChatMessage:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string }
    ChatMessage:
      type: object
      additionalProperties: false
      required: [id, conversation_id, role, kind, text, task_id, created_at]
      properties:
        id: { type: integer }
        conversation_id: { type: string, format: uuid }
        role: { enum: [user, assistant] }
        kind: { enum: [text, question, result, error, info, ui, ui_action] }
        text: { type: string }
        task_id: { type: [string, "null"], format: uuid }
        ui:
          description: >-
            A2UI, for the kinds ui and ui_action only. For ui, an array of the
            A2UI v1.0 messages the assistant sent to the page (createSurface,
            updateComponents, updateDataModel, deleteSurface,
            callRendererFunction, agentFunctionResponse), validated before they
            were stored; the page draws them in order. For ui_action, the one
            renderer-to-agent message the page sent back (action, error,
            callAgentFunction or rendererFunctionResponse), shown as the user's
            turn. Absent from the other kinds.
        created_at: { type: string, format: date-time }
    ChatMessageList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
    Workflow:
      type: object
      additionalProperties: false
      required: [id, description, kind, payload_hint, intents]
      properties:
        id: { type: string, minLength: 1 }
        description: { type: string }
        kind: { enum: [builtin, yaml] }
        intents:
          description: >-
            What the workflow handles, when it declares it: the workflows with intents
            are the ones the orchestrator may route a message to. null when it has none
            (and then it is never offered).
          type: [object, "null"]
          additionalProperties: false
          required: [description, examples]
          properties:
            description: { type: string }
            examples:
              type: array
              items: { type: string }
        payload_hint:
          description: A payload that works as a starting point.
          type: string
    WorkflowList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Workflow" }
    Removed:
      type: object
      additionalProperties: false
      required: [removed]
      properties:
        removed: { type: integer, minimum: 0 }
    NewMessage:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          description: The user's answer, any JSON value except null.
    Step:
      type: object
      additionalProperties: false
      required: [id, task_id, step, attempt, state, outcome, error, action, patch, tool, tool_result, reply, input_tokens, output_tokens, duration_ms, at, workflow_id, depth]
      properties:
        id: { type: integer }
        task_id: { type: string, format: uuid }
        step: { type: integer, minimum: 0 }
        attempt:
          description: 1-based attempt within the step; 0 for a failure that had no model call.
          type: integer
          minimum: 0
        state: { type: string }
        outcome: { enum: [ok, retry, rejected, failed] }
        error:
          description: Why the reply was refused or the run failed; null when nothing went wrong.
          type: [string, "null"]
        action: { type: [object, "null"] }
        patch: { type: [object, "null"] }
        tool: { type: [string, "null"] }
        tool_result: { type: [string, "null"] }
        reply:
          description: The model's raw reply, cut at 8 KB.
          type: [string, "null"]
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        duration_ms: { type: integer, minimum: 0 }
        at: { type: string, format: date-time }
        workflow_id:
          description: The workflow the step ran in; null for steps recorded before delegation existed.
          type: [string, "null"]
        depth:
          description: How many runs deep, above 0 for the steps of a workflow the request was handed to (delegation); its steps continue the numbering of the run that handed it on.
          type: integer
          minimum: 0
    StepList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Step" }
    TaskUsage:
      description: What the task's successful model calls used; zeros and no models if it made none.
      type: object
      additionalProperties: false
      required: [calls, input_tokens, output_tokens, cost_usd, models]
      properties:
        calls: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        cost_usd: { type: number, minimum: 0 }
        models:
          description: Ids of the models that answered, in the order they first did.
          type: array
          items: { type: string }
    CallOutcome:
      enum: [ok, error, timeout, rate_limited, canceled]
    Call:
      type: object
      additionalProperties: false
      required: [id, task_id, user_id, model_id, provider_id, model_name, tags, input_tokens, output_tokens, cost_usd, started_at, duration_ms, outcome, error]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: [string, "null"], format: uuid }
        user_id: { type: string, format: uuid }
        model_id: { type: string }
        provider_id: { type: string }
        model_name:
          description: The provider's own name for the model.
          type: string
        tags:
          description: The tags the step asked for.
          type: array
          items: { type: string }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        cost_usd: { type: number, minimum: 0 }
        started_at: { type: string, format: date-time }
        duration_ms: { type: integer, minimum: 0 }
        outcome: { $ref: "#/components/schemas/CallOutcome" }
        error:
          description: The provider's error text; null for a successful call.
          type: [string, "null"]
    CallList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Call" }
    AttemptList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Call" }
        total:
          description: How many attempts match, across all pages.
          type: integer
          minimum: 0
        limit: { type: integer, minimum: 1, maximum: 200 }
        offset: { type: integer, minimum: 0 }
    UsageRow:
      type: object
      additionalProperties: false
      required: [user_id, provider_id, model_id, calls, input_tokens, output_tokens, cost_usd]
      properties:
        user_id: { type: string, format: uuid }
        provider_id: { type: string }
        model_id: { type: string }
        calls: { type: integer, minimum: 1 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        cost_usd: { type: number, minimum: 0 }
    UsageList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UsageRow" }
    Model:
      type: object
      additionalProperties: false
      required: [id, provider, tags, priority, available, unavailable_until]
      properties:
        id: { type: string }
        provider: { type: string }
        tags:
          type: array
          items: { type: string }
        priority: { type: integer }
        available:
          description: False while the circuit breaker holds the model, or its provider, out of service.
          type: boolean
        unavailable_until:
          description: When it will be tried again; null if it is available, or if it waits for a credential rather than for a cooldown.
          type: [string, "null"]
          format: date-time
        unavailable_reason:
          description: Why it is not available; left out while it is available. cooldown means the circuit breaker holds it, missing_credentials that its provider needs a credential that is not present. Never says where the credential comes from.
          enum: [cooldown, missing_credentials]
    ModelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Model" }
    NewTask:
      type: object
      additionalProperties: false
      required: [user_id, workflow_id]
      properties:
        user_id: { type: string, format: uuid }
        workflow_id: { type: string, minLength: 1 }
        payload:
          description: Input for the workflow; defaults to {}.
          type: object
    TaskList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        total:
          description: How many tasks match the filter, across all pages.
          type: integer
          minimum: 0
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
