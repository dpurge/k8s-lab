---
# The pgadmin-config ConfigMap (servers.json) is generated at deploy time by
# _ensure-pgadmin-config in Taskfile.yml, from k8s/pgadmin/servers.json.tmpl —
# not applied from this file — since it needs the real Postgres
# superuser/db from .k3d/postgres.env, not a hardcoded guess.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9.11.0
          ports:
            - name: http
              containerPort: 80
          env:
            # Fixed, non-secret dev login — matches this cluster's
            # no-auth-for-dev-tools posture (see Qdrant/NATS/Argo comments
            # elsewhere in k8s/); not meant to gate anything real.
            - name: PGADMIN_DEFAULT_EMAIL
              value: admin@k8s-lab.local
            - name: PGADMIN_DEFAULT_PASSWORD
              value: admin
            # pgAdmin's email validator rejects .local as a reserved/
            # special-use TLD unless explicitly allowed.
            - name: PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS
              value: "['local']"
            # Consumed once on first start: entrypoint.sh installs this as
            # ~<user>/.pgpass (see servers.json's PassFile above).
            - name: PGPASS_FILE
              value: /pgpass-secret/pgpass
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # dpage/pgadmin4's python3 binary carries a cap_net_bind_service
              # file capability so it can bind port 80 as non-root (UID 5050);
              # without it, exec() of python3/gunicorn fails with EPERM.
              add: [NET_BIND_SERVICE]
          resources:
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
            - name: data
              mountPath: /var/lib/pgadmin
            - name: pgpass-secret
              mountPath: /pgpass-secret
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: pgadmin-config
        - name: data
          emptyDir:
            sizeLimit: 10Mi
        - name: pgpass-secret
          secret:
            secretName: pgadmin-pgpass
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: data
spec:
  selector:
    app: pgadmin
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin
  namespace: data
spec:
  ingressClassName: traefik
  rules:
    - host: pgadmin.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pgadmin
                port:
                  number: 80
