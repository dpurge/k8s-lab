---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      containers:
        - name: adminer
          image: adminer:5.5.1-standalone
          ports:
            - containerPort: 8080
          env:
            # FR-ADM-003: prefill the server field with the Postgres service DNS name
            - name: ADMINER_DEFAULT_SERVER
              value: postgres.data.svc.cluster.local
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: data
spec:
  selector:
    app: adminer
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
# FR-ADM-002: ingress host adminer.localhost, Traefik on host port 8080 (SPECS §9.1, HITL-1)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adminer
  namespace: data
spec:
  ingressClassName: traefik
  rules:
    - host: adminer.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adminer
                port:
                  number: 8080
