---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
  namespace: data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  namespace: data
spec:
  replicas: 1
  # Recreate required: RWO PVC cannot attach to an old and a new pod simultaneously
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v2.3.0
          ports:
            - containerPort: 3900
              name: s3-api
            - containerPort: 3902
              name: web
            - containerPort: 3903
              name: admin
          volumeMounts:
            - name: garage-data
              mountPath: /var/lib/garage
            - name: garage-config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
          # /health stays 503 until `task deploy-garage`'s bootstrap step assigns the layout.
          readinessProbe:
            httpGet:
              path: /health
              port: 3903
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          # TCP only, not /health: liveness must reflect the process, not
          # cluster health, or it loops killing the pod before init-garage
          # ever gets a chance to run (see above).
          livenessProbe:
            tcpSocket:
              port: 3903
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: garage-data
          persistentVolumeClaim:
            claimName: garage-data
        - name: garage-config
          secret:
            secretName: garage-config
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: data
spec:
  selector:
    app: garage
  ports:
    - port: 3900
      targetPort: 3900
      name: s3-api
    - port: 3902
      targetPort: 3902
      name: web
    - port: 3903
      targetPort: 3903
      name: admin
  type: ClusterIP
---
# S3 API — path-style requests only (clients must set force_path_style/equivalent);
# Traefik routes purely on Host, so bucket-in-subdomain (virtual-hosted-style)
# addressing does not work through this ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garage-s3
  namespace: data
spec:
  ingressClassName: traefik
  rules:
    - host: garage.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage
                port:
                  number: 3900
---
# Admin API — cluster status/health and bucket/key management over HTTP.
# Requires "Authorization: Bearer <admin_token>" from .k3d/garage.toml, except /health.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garage-admin
  namespace: data
spec:
  ingressClassName: traefik
  rules:
    - host: garage-admin.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage
                port:
                  number: 3903
