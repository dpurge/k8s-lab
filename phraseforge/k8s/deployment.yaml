---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phraseforge
  namespace: app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: phraseforge
  template:
    metadata:
      labels:
        app: phraseforge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: phraseforge
          image: k8s-lab-registry:5000/phraseforge:dev
          # Always: the "dev" tag is mutable (rebuilt on every `task deploy-phraseforge`);
          # without this, kubelet reuses whatever it already cached for that tag.
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
          env:
            - name: CONFIG_FILE
              value: /etc/phraseforge/config.yaml
            - name: PGHOST
              value: postgres.data.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: phraseforge
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD # reused as a signing key; dedicated secret can follow later
            # Provider API keys: optional. They come from the Secret phraseforge-llm-keys,
            # which `task` does not create (see the README, "Where to configure API keys");
            # without it these variables are unset. A provider reads one through
            # api_key_from: env:NAME in models.yaml; with the variable empty, anthropic and
            # vertex are disabled (logged), ollama and openai send no credential. A key never
            # goes in a manifest.
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: phraseforge-llm-keys
                  key: OLLAMA_API_KEY
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: phraseforge-llm-keys
                  key: OPENROUTER_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: phraseforge-llm-keys
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: phraseforge-llm-keys
                  key: OPENAI_API_KEY
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/phraseforge
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
      volumes:
        - name: config
          configMap:
            name: phraseforge-config
---
apiVersion: v1
kind: Service
metadata:
  name: phraseforge
  namespace: app
spec:
  selector:
    app: phraseforge
  ports:
    - port: 8090
      targetPort: 8090
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phraseforge
  namespace: app
spec:
  ingressClassName: traefik
  rules:
    - host: phraseforge.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: phraseforge
                port:
                  number: 8090
