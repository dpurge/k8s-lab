---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phraseforge
  namespace: app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: phraseforge
  template:
    metadata:
      labels:
        app: phraseforge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: phraseforge
          image: k8s-lab-registry:5000/phraseforge:dev
          # Always: the "dev" tag is mutable (rebuilt on every `task build-image`);
          # without this, kubelet reuses whatever it already cached for that tag.
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
          env:
            - name: PGHOST
              value: postgres.data.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: phraseforge
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: BIND_ADDR
              value: 0.0.0.0:8090
            - name: SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD # reused as a signing key; dedicated secret can follow later
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: phraseforge
  namespace: app
spec:
  selector:
    app: phraseforge
  ports:
    - port: 8090
      targetPort: 8090
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phraseforge
  namespace: app
spec:
  ingressClassName: traefik
  rules:
    - host: phraseforge.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: phraseforge
                port:
                  number: 8090
