---
apiVersion: batch/v1
kind: Job
metadata:
  name: phraseforge-migrate
  namespace: app
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: migrate
          image: k8s-lab-registry:5000/phraseforge:dev
          imagePullPolicy: Always
          command: ["/phraseforge", "migrate"]
          env:
            - name: CONFIG_FILE
              value: /etc/phraseforge/config.yaml
            - name: PGHOST
              value: postgres.data.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: phraseforge
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /etc/phraseforge
              readOnly: true
      volumes:
        # config.yaml (phraseforge-config) and models.yaml (phraseforge-models, built
        # by the Taskfile from models.dev.yaml or a generated file) in one directory.
        - name: config
          projected:
            sources:
              - configMap:
                  name: phraseforge-config
              - configMap:
                  name: phraseforge-models
