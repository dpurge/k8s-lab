apiVersion: v1
kind: ConfigMap
metadata:
  name: phraseforge-config
  namespace: app
data:
  # Every purpose's model_tags/timeoutSeconds/maxAttempts/maxReplyTokens/prompt is declared
  # explicitly here (matching config.go's defaultFileConfig() values
  # verbatim) rather than left to the Go binary's own compiled-in
  # defaults — that's the whole point of llm-purpose-timeout-and-prompt-
  # config: an operator edits the prompt/timeout text actually running in
  # the cluster (kubectl edit configmap/phraseforge-config, or edit this
  # file and re-apply) without a rebuild. Per-(kind, source_language,
  # target_language) overrides still live in the DB via Admin > LLM;
  # this is the purpose-wide default every override falls back to.
  config.yaml: |
    bindAddr: 0.0.0.0:8090
    ingest:
      # Largest raw content (bytes) one ingest request may carry. Content is
      # processed in chunks that fit each purpose's context window, so a
      # long page costs one LLM call per chunk (minutes each on a CPU-only
      # node, one job at a time). Lower it if ingests hog the queue.
      maxContentBytes: 204800
    llm_calls:
      # Days to keep the model-call history (table llm_calls); older rows are purged every 6 hours. 0 keeps it forever.
      retention_days: 30
    jobs:
      # Days to keep finished jobs (table jobs); older rows are purged every 6 hours.
      # Pending and running jobs are never purged. 0 keeps them forever.
      # Jobs that finished with status done:
      retention_days_done: 7
      # Jobs that finished with status failed or cancelled (kept longer so they can be inspected or retried):
      retention_days_failed: 30
    nats:
      # NATS server of the message bus (the app answers task_status on dp.phraseforge.request).
      # Empty: the app never connects. PHRASEFORGE_NATS_URL overrides it.
      url: nats://jdp-data-nats.data.svc:4222
    transcription:
      model_tags: [default]
      numCtx: 4096
      timeoutSeconds: 1800
      maxAttempts: 3
      maxReplyTokens: 0
      prompt: |
        You write the transcription of the source text in Latin script, the way language handbooks do.

        - Follow the transcription rules below: they name the system for the language of the text.
        - Transcribe the way the text is spoken, word by word.
        - Keep every diacritic and special letter the rules require (tone marks, macrons, dots); never replace them with plain letters.
        - Capitalize as in normal text: the first word of each sentence and proper nouns; everything else in lower case.
        - Use only Latin punctuation (, . ! ? : ; ' " ( )), never the punctuation of the source script.
        - Preserve the line breaks and structure. Do not translate, explain or comment.
        Respond with only the transcription.

        {{transcriptionPrompt}}

        Example 1 (Arabic).
        Input: كتب الطالب الدرس في المدرسة.
        Output: Kataba ṭ-ṭālib ad-dars fi-l-madrasa.

        Example 2 (Japanese).
        Input: 私は毎日学校に行きます。
        Output: Watashi wa mainichi gakkō ni ikimasu.
    translation:
      model_tags: [default]
      numCtx: 4096
      timeoutSeconds: 1800
      maxAttempts: 3
      maxReplyTokens: 0
      prompt: "Translate the source language content to the target language. Return only the translation, preserving line breaks and structure. Do not add explanations."
    title:
      model_tags: [default]
      numCtx: 8192
      timeoutSeconds: 1800
      maxAttempts: 3
      maxReplyTokens: 0
      prompt: "You write a short, specific title for the given text. Respond with only the title text on a single line — no quotes, no punctuation at the end, no preamble."
    processText:
      model_tags: [default]
      numCtx: 8192
      timeoutSeconds: 1800
      maxAttempts: 3
      maxReplyTokens: 0
      prompt: |
        You clean raw text copied from a web page or a lesson down to the reading text itself, as Markdown.

        Keep only what a reader reads: the headline of the text, if it has one, as a Markdown heading, and its paragraphs, in the original order and wording.
        Remove everything else:
        - navigation menus, breadcrumbs, cookie notices, share buttons, ads, newsletter boxes, links to other articles ("read also"), footers, copyright, author and date lines;
        - any introduction to the text: a lesson number or title, "In this lesson you will...", instructions, a warm-up or pre-reading question, a vocabulary list;
        - anything after the text: comprehension questions, exercises, answers, notes for the teacher, further reading.
        Do not translate, summarize, correct or add anything: keep the original language and the original sentences. If the input starts or ends in the middle of a sentence, keep it that way and do not invent a headline.
        Respond with only the cleaned Markdown, without comments.

        Example 1.
        Input:
        Startseite | Lektionen
        Lektion 2: Lesen
        In dieser Lektion lesen Sie einen kurzen Text.
        Vor dem Lesen: Trinken Sie gern Tee?
        Tee in Deutschland
        Viele Deutsche trinken jeden Tag Tee. Am liebsten trinken sie ihn am Nachmittag.
        Fragen zum Text:
        1. Wann trinken die Deutschen Tee?
        Teilen auf Facebook
        Output:
        ## Tee in Deutschland

        Viele Deutsche trinken jeden Tag Tee. Am liebsten trinken sie ihn am Nachmittag.

        Example 2.
        Input:
        Menú | Noticias | Contacto
        Por Ana Pérez, 4 de mayo de 2026
        Abre una nueva biblioteca
        El ayuntamiento abrió ayer una nueva biblioteca.

        Tiene más de cien mil libros.
        Lee también: Las mejores bibliotecas de España
        Suscríbete a nuestro boletín
        Output:
        ## Abre una nueva biblioteca

        El ayuntamiento abrió ayer una nueva biblioteca.

        Tiene más de cien mil libros.
    processDialog:
      model_tags: [default]
      numCtx: 8192
      timeoutSeconds: 1800
      maxAttempts: 3
      maxReplyTokens: 0
      prompt: |
        You clean raw text copied from a web page or a lesson down to the dialog itself, as a Markdown transcript.

        Keep only the spoken turns, in the original order and wording, each turn on its own line, with the speaker's label as in the text (a name, A:, B:, a dash). If a line holds several turns, split it into one line per turn.
        Remove everything else:
        - navigation, cookie notices, ads, share buttons, links, footers, copyright;
        - any introduction to the dialog: a lesson or dialog number and title, instructions such as "Listen and repeat", the scene description;
        - anything after the dialog: exercises, questions, answers, "read next" links.
        Do not translate, summarize, correct or add anything.
        Respond with only the cleaned dialog, without comments.

        Example.
        Input:
        Startseite | Dialoge
        Dialog 2: Im Café
        Hören Sie den Dialog und sprechen Sie nach.
        A: Guten Tag, ich möchte einen Kaffee. B: Gern. Mit Milch?
        A: Ja, bitte.
        Übung: Beantworten Sie die Fragen.
        1. Was bestellt A?
        Weiterlesen: Dialog 3
        Output:
        A: Guten Tag, ich möchte einen Kaffee.
        B: Gern. Mit Milch?
        A: Ja, bitte.
    generateVocabulary:
      model_tags: [default]
      numCtx: 8192
      timeoutSeconds: 1800
      maxAttempts: 3
      maxReplyTokens: 0
      prompt: |
        You extract vocabulary from the given text for a language learner. Respond ONLY with one item per line, in this exact format:
        phrase {grammar} [transcription] | usage
        No preamble, numbering, bullets, comments or code fences, only the item lines.

        - phrase: the dictionary form, never the inflected form found in the text; the rules for this language are described below. Keep the original script and spelling. Prefer single words. Skip names, numbers and very common words.
        - {grammar}: only when a description of the grammar tags is given below: the tags, following that description. Leave it out if unsure.
        - [transcription]: only when transcription rules are given below: the word in Latin script, following those rules, as it is pronounced. Never leave it out then.
        - usage after |: a short phrase copied from the text, in its original language and spelling, that shows the word as it is used there: a noun phrase, a verb with its object, or a subject with an intransitive verb. At most 80 characters, never a whole sentence, never translated, never made up: cut the sentence down around the word instead of rewriting it. Leave it out if the text has no short phrase for the word.
        Each of {grammar}, [transcription] and | usage is left out entirely, without empty brackets, when it does not apply.

        {{dictionaryPrompt}}

        {{grammarPrompt}}

        {{transcriptionPrompt}}

        Example 1.
        Input: كتب الطالب الدرس في المدرسة.
        Output:
        كَتَبَ {V} [kataba] | كتب الطالب الدرس
        طَالِبٌ {N m sg} [ṭālib] | كتب الطالب
        دَرْسٌ {N m sg} [dars] | الدرس في المدرسة
        مَدْرَسَةٌ {N f sg} [madrasa] | في المدرسة

        Example 2.
        Input: Die Kinder lesen jeden Tag ein neues Buch.
        Output:
        das Kind {N n} | Die Kinder lesen
        lesen {V} | lesen jeden Tag ein neues Buch
        der Tag {N m} | jeden Tag
        neu {Adj} | ein neues Buch
        das Buch {N n} | ein neues Buch
    generateModels:
      model_tags: [default]
      numCtx: 8192
      timeoutSeconds: 1800
      maxAttempts: 3
      maxReplyTokens: 0
      prompt: |
        You extract the key sentence patterns of the given text for a language learner: the phrases with a complicated structure that a learner should be able to build, such as a verb with its preposition or case, a conditional, a relative or subordinate clause, or a construction with a gap. Respond ONLY with one item per line, in this exact format:
        phrase [transcription] = translation
        No preamble, numbering, bullets, comments or code fences, only the item lines.

        - Choose 3 to 8 phrases, no more, and only the ones worth learning. Skip simple sentences and single words.
        - Order them from the simplest to the most complicated: each phrase a little longer or more involved than the one before it; where it helps, build a phrase up from the previous one.
        - Use the wording of the text. A part the learner can replace is written as "...".
        - [transcription]: only when transcription rules are given below: the phrase in Latin script, following those rules, as it is pronounced, capitalized only as a normal sentence is. Never leave it out then.
        - translation after =: into Polish, short and natural, with "; " between alternatives (never "/") and no parentheses.
        Each of [transcription] and = translation is left out entirely, without empty brackets, when it does not apply.

        {{transcriptionPrompt}}

        Example 1.
        Input: Die Union verliert im Vergleich zum Vormonat an Zuspruch und liegt jetzt bei 21 Prozent. Viele Menschen sind mit der Lage unzufrieden.
        Output:
        Die Partei liegt bei ... Prozent. = Partia ma ... procent.
        Viele Menschen sind mit ... unzufrieden. = Wielu ludzi jest niezadowolonych z ...
        Die Union verliert im Vergleich zum Vormonat an Zuspruch. = Unia traci poparcie w porównaniu z poprzednim miesiącem.

        Example 2.
        Input: لن تكون هذه النهاية، مهما اشتدت الصعوبات. سأواصل النضال من أجل تحقيق أحلامي.
        Output:
        لَنْ تَكُونَ هَذِهِ النِّهَايَةَ [lan takūna hāḏihi-n-nihāya] = to nie będzie koniec
        سَأُوَاصِلُ النِّضَالَ [saʾuwāṣilu-n-niḍāl] = będę kontynuować walkę
        سَأُوَاصِلُ النِّضَالَ مِنْ أَجْلِ تَحْقِيقِ أَحْلَامِي [saʾuwāṣilu-n-niḍāl min aǧl taḥqīq aḥlāmī] = będę kontynuować walkę o realizację moich marzeń
    # One structured (JSON) call per vocabulary/models item per site
    # locale. Templates use the prompt-eval placeholders {{sourceLanguage}},
    # {{targetLanguage}}, {{phrase}}, {{grammarPrompt}},
    # {{transcriptionPrompt}}; the two snippets come from Admin > Languages.
    # The transcription, generateVocabulary and generateModels prompts above
    # carry the same two placeholders: a prompt in this file replaces the
    # embedded default, so it must contain a placeholder to use its snippet.
    # Keep these prompts equal to prompt-eval's prompt/phraseforge/default/system files
    # (config_test.go checks it).
    vocabularyItem:
      model_tags: [default]
      numCtx: 4096
      timeoutSeconds: 1800
      maxAttempts: 3
      maxReplyTokens: 512
      prompt: |
        You are a dictionary. Return ONLY valid JSON without a code fence and without explanations:

        {
          "phrase": "repeat the original phrase exactly",
          "grammar": "grammar tags attached to the original phrase, follow the description below; null if unsure",
          "transcription": "only if a transcription is described below, otherwise null",
          "translation": "the meaning of the phrase in the target language",
          "notes": null,
          "example": "a short phrase that shows how the word is used, or null",
          "newSense": null,
          "rewrite": null
        }

        Rules:
        - translation: as a dictionary of the target language gives it. Lowercase, unless it is a name that is normally capitalized. Several senses are joined with "; " (never with "/" or a comma). No parentheses, no explanation, no full stop. When an existing translation is shown below, give it unchanged.
        - notes: null, almost always. Write a note only when the translation could be misunderstood without it (a false friend, an unusual sense). Keep it short and write it in the target language, never in English unless English is the target language.
        - example: one short phrase in the source language that shows how the word is used (a noun phrase, a verb with its object, or a subject with an intransitive verb): at most 80 characters, never a whole sentence. Take it from the usage below, shortened or corrected if needed. It must never be one of the known examples: if the usage is empty or already among the known examples, use null.
        - newSense: null when no existing translation is shown below or when it already covers the usage. When it does not cover the meaning the usage shows, give that one extra meaning in the target language here, in the style of the translation, without "; ". The extra meaning goes only in newSense: translation stays exactly the existing translation, and notes stay null.
        - rewrite: null when the phrase is already in the dictionary form described below, or when the usage is empty. When it is not (a different case than a dictionary gives, or a joined form, such as a noun or a preposition with a personal suffix attached), give the dictionary form as {"phrase": "...", "grammar": "...", "transcription": "..."}: the grammar tags and the transcription of the new phrase, following the descriptions below (null if none is described). The other fields still describe the original phrase.

        {{dictionaryPrompt}}

        {{grammarPrompt}}

        {{transcriptionPrompt}}

        Usage in the text this phrase came from (unknown if empty):
        {{usage}}

        Known examples of this phrase, never repeat one of them (none if empty):
        {{examples}}

        Existing translation of this phrase in the target language (none if empty):
        {{translation}}

        Example 1. Translate from German to Polish: der Koffer
        {"phrase": "der Koffer", "grammar": "N m", "transcription": null, "translation": "walizka", "notes": null, "example": "einen Koffer packen", "newSense": null, "rewrite": null}

        Example 2. Translate from Standard Arabic to English: مُهَنْدِسَةٌ
        {"phrase": "مُهَنْدِسَةٌ", "grammar": "N f sg", "transcription": "muhandisa", "translation": "engineer", "notes": null, "example": "مُهَنْدِسَةٌ مَاهِرَةٌ", "newSense": null, "rewrite": null}

        Example 3. Translate from German to Polish: Kinder (usage: die Kinder spielen)
        {"phrase": "Kinder", "grammar": "N pl", "transcription": null, "translation": "dzieci", "notes": null, "example": "die Kinder spielen", "newSense": null, "rewrite": {"phrase": "das Kind", "grammar": "N n", "transcription": null}}

        Example 4. Translate from Standard Arabic to English: كِتَابُهُ (usage: قرأت كتابه)
        {"phrase": "كِتَابُهُ", "grammar": "N m sg", "transcription": "kitābuhu", "translation": "his book", "notes": null, "example": null, "newSense": null, "rewrite": {"phrase": "كِتَابٌ", "grammar": "N m sg", "transcription": "kitāb"}}

        Example 5. Translate from German to Polish: Hahn (usage: den Hahn aufdrehen; existing translation: kogut)
        {"phrase": "Hahn", "grammar": "N m", "transcription": null, "translation": "kogut", "notes": null, "example": "den Hahn aufdrehen", "newSense": "kran", "rewrite": null}

        Translate from {{sourceLanguage}} to {{targetLanguage}}: {{phrase}}
    modelsItem:
      model_tags: [default]
      numCtx: 4096
      timeoutSeconds: 1800
      maxAttempts: 3
      maxReplyTokens: 512
      prompt: |
        You are a translation system. Return ONLY valid JSON without a code fence and without explanations:

        {
          "phrase": "repeat the original phrase exactly, including any ... gap",
          "transcription": "only if a transcription is described below, otherwise null",
          "translation": "the meaning of the phrase in the target language"
        }

        Rules:
        - translation: natural and short, as a dictionary or a phrasebook gives it. A gap "..." stays a gap. Alternatives are joined with "; " (never "/"). No parentheses. Start with a capital letter only where the phrase is a complete sentence.

        {{transcriptionPrompt}}

        Example 1. Translate from German to Polish: Viele Menschen sind mit ... unzufrieden.
        {"phrase": "Viele Menschen sind mit ... unzufrieden.", "transcription": null, "translation": "Wielu ludzi jest niezadowolonych z ..."}

        Example 2. Translate from Standard Arabic to English: لَنْ تَكُونَ هَذِهِ النِّهَايَةَ
        {"phrase": "لَنْ تَكُونَ هَذِهِ النِّهَايَةَ", "transcription": "lan takūna hāḏihi-n-nihāya", "translation": "this will not be the end"}

        Translate from {{sourceLanguage}} to {{targetLanguage}}: {{phrase}}
    checkVocabulary:
      model_tags: [default]
      numCtx: 8192
      timeoutSeconds: 1800
      maxAttempts: 3
      maxReplyTokens: 0
      prompt: |
        You check vocabulary for a language learner. Below are phrases in {{sourceLanguage}} that the learner's dictionary already knows. Each one comes with a usage, a short phrase from a new text in which the word occurs, with the examples and translations the dictionary already has for it. For each phrase decide two things: whether the usage should be added as one more example, and whether it shows a meaning that none of the existing translations covers.

        needsExample is true when the usage is a correct short phrase that shows the word in a use the known examples do not show: another construction, another object or subject, or another sense. It is false when the usage repeats a known example, differs from one only in a trivial way, or is not a correct use of the phrase. When the phrase has no examples yet, a correct usage gives true.

        needsSense is true when the usage shows a meaning of the word that none of the translations listed covers (a different sense, not just a different construction). It is false when a listed translation already covers the meaning of the usage, and false when the phrase has no translation.

        Return ONLY valid JSON without a code fence and without explanations, with one entry for every numbered phrase:

        {"results": [{"n": 1, "needsExample": true, "needsSense": false}, {"n": 2, "needsExample": false, "needsSense": false}]}

        Example. Phrases in German:
        1. der Koffer
           usage: den Koffer packen
           examples: ein schwerer Koffer
           translations: pl: walizka
        2. der Tag
           usage: jeden Tag
           examples: jeden Tag | der erste Tag
           translations: pl: dzień
        3. der Hahn
           usage: den Hahn aufdrehen
           examples: ein junger Hahn
           translations: pl: kogut
        Answer:
        {"results": [{"n": 1, "needsExample": true, "needsSense": false}, {"n": 2, "needsExample": false, "needsSense": false}, {"n": 3, "needsExample": true, "needsSense": true}]}

        Phrases in {{sourceLanguage}}:
        {{candidates}}
        Answer:
    # reviewVocabulary reviews one vocabulary item and proposes corrections. It
    # has its own model_tags, like every purpose: give it a tag of its own (for
    # example reviewer, carried by a more capable model in models.yaml) to
    # review with a stronger model; no other purpose is affected.
    reviewVocabulary:
      model_tags: [default]
      numCtx: 8192
      timeoutSeconds: 1800
      maxAttempts: 3
      maxReplyTokens: 0
      prompt: |
        You review one entry of a language learner's dictionary. The entry is a phrase in {{sourceLanguage}} with its grammar tags, transcription, translations into other languages, notes and examples. Check every part below and report what should change. Do not change what is fine: for a correct part answer ok true with an empty suggestion and an empty reason.

        Return ONLY valid JSON without a code fence and without explanations:

        {"phrase": {"ok": true, "suggestion": "", "reason": ""}, "grammar": {"ok": true, "suggestion": "", "reason": ""}, "transcription": {"ok": true, "suggestion": "", "reason": ""}, "translations": [{"locale": "en", "ok": true, "suggestion": "", "reason": ""}], "notes": [{"locale": "en", "ok": true, "suggestion": "", "reason": ""}], "examples": [{"index": 1, "action": "keep", "suggestion": "", "reason": ""}]}

        Every check has ok (false when something is wrong), suggestion (the corrected value; empty when ok, or when you cannot give a better one) and reason (one short sentence; empty when ok). Give one entry in translations for every translation listed, one in notes for every notes line listed, and one in examples for every numbered example.

        Checks:
        - phrase: is it the dictionary form, spelled correctly? The rules for the dictionary form are below; when they are empty, answer ok true. If you change the phrase you must also give a grammar and a transcription suggestion for the new phrase (repeat the current ones when they stay valid), because the three change together.
        - grammar: are the tags correct for the phrase, and only tags from the description below?
        - transcription: does it match the phrase and follow the transcription rules below?
        - translations: is each translation correct for the phrase? The English translation, when listed, is the reference for judging the others. Senses are separated by "; " (never "/" or ","), and a translation holds only translations, never explanations or parentheses. It is lowercase unless the phrase is a name that is normally capitalized, and has no full stop. Give a shorter suggestion when it can be shortened without losing a sense.
        - notes: are they really needed? If the translation alone is enough to understand the phrase, answer ok false with an empty suggestion, which means remove the notes. If they are needed, suggest a shorter text when possible.
        - examples: is each one needed to show how the phrase is used? Answer action "remove" for an example that repeats another one or adds nothing, "shorten" with a suggestion for one that can be shorter (at most 80 characters, still showing the phrase), otherwise "keep".

        Dictionary form of the phrase:
        {{dictionaryPrompt}}

        Grammar tags:
        {{grammarPrompt}}

        Transcription:
        {{transcriptionPrompt}}

        Example. Entry in German:
        phrase: der Koffer
        grammar: N f
        transcription: none
        translations:
        - en: suitcase; case; (a bag for travelling)
        - pl: walizka
          notes: walizka na kółkach, duża torba podróżna używana na wyjazdach
        examples:
        1. ein schwerer Koffer
        2. ein schwerer Koffer
        3. Er packt den Koffer für die lange Reise nach Italien im Sommer.
        Answer:
        {"phrase": {"ok": true, "suggestion": "", "reason": ""}, "grammar": {"ok": false, "suggestion": "N m", "reason": "Koffer is masculine."}, "transcription": {"ok": true, "suggestion": "", "reason": ""}, "translations": [{"locale": "en", "ok": false, "suggestion": "suitcase; case", "reason": "The explanation in parentheses is not a translation."}, {"locale": "pl", "ok": true, "suggestion": "", "reason": ""}], "notes": [{"locale": "pl", "ok": false, "suggestion": "", "reason": "The translation is enough."}], "examples": [{"index": 1, "action": "keep", "suggestion": "", "reason": ""}, {"index": 2, "action": "remove", "suggestion": "", "reason": "Repeats example 1."}, {"index": 3, "action": "shorten", "suggestion": "den Koffer für die Reise packen", "reason": "Too long."}]}

        Entry in {{sourceLanguage}}:
        phrase: {{phrase}}
        grammar: {{grammar}}
        transcription: {{transcription}}
        translations:
        {{translations}}
        examples:
        {{examples}}
        Answer:
    # reviewModels reviews one models item and proposes corrections, with its own
    # model_tags.
    reviewModels:
      model_tags: [default]
      numCtx: 8192
      timeoutSeconds: 1800
      maxAttempts: 3
      maxReplyTokens: 0
      prompt: |
        You review one entry of a language learner's list of model phrases. A model phrase is a short sentence pattern in {{sourceLanguage}} that a learner should be able to build, such as a verb with its preposition or case, a conditional, or a construction with a gap written "...". The entry has the phrase, its transcription and its translations into other languages. Check every part below and report what should change. Do not change what is fine: for a correct part answer ok true with an empty suggestion and an empty reason.

        Return ONLY valid JSON without a code fence and without explanations:

        {"phrase": {"ok": true, "suggestion": "", "reason": ""}, "transcription": {"ok": true, "suggestion": "", "reason": ""}, "translations": [{"locale": "en", "ok": true, "suggestion": "", "reason": ""}]}

        Every check has ok (false when something is wrong), suggestion (the corrected value; empty when ok, or when you cannot give a better one) and reason (one short sentence; empty when ok). Give one entry in translations for every translation listed.

        Checks:
        - phrase: is it correct, natural {{sourceLanguage}}, spelled correctly, and a useful pattern to learn? A gap "..." must stay a gap. If you change the phrase you must also give a transcription suggestion for the new phrase when a transcription is listed (repeat the current one when it stays valid), because the two change together.
        - transcription: does it match the phrase and follow the transcription rules below? When no transcription is listed or the rules are empty, answer ok true.
        - translations: is each translation correct for the phrase? The English translation, when listed, is the reference for judging the others. A gap "..." stays a gap, alternatives are separated by "; " (never "/"), and a translation holds no explanations or parentheses. It starts with a capital letter only where the phrase is a complete sentence. Give a shorter suggestion when it can be shortened without losing a meaning.

        Transcription rules:
        {{transcriptionPrompt}}

        Example. Entry in German:
        phrase: Ich warte auf ...
        transcription: none
        translations:
        - en: I am waiting for ...; (a verb that takes the accusative)
        - pl: Czekam na ...
        Answer:
        {"phrase": {"ok": true, "suggestion": "", "reason": ""}, "transcription": {"ok": true, "suggestion": "", "reason": ""}, "translations": [{"locale": "en", "ok": false, "suggestion": "I am waiting for ...", "reason": "The explanation in parentheses is not a translation."}, {"locale": "pl", "ok": true, "suggestion": "", "reason": ""}]}

        Entry in {{sourceLanguage}}:
        phrase: {{phrase}}
        transcription: {{transcription}}
        translations:
        {{translations}}
        Answer:
    # reviewTranscription reviews the transcription of one text or dialog, with its own
    # model_tags.
    reviewTranscription:
      model_tags: [default]
      numCtx: 16384
      timeoutSeconds: 1800
      maxAttempts: 3
      maxReplyTokens: 0
      prompt: |
