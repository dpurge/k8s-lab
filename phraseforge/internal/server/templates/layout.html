{{define "layout"}}
<!doctype html>
<html lang="{{.Locale}}">
<head>
  <meta charset="utf-8">
  <title>{{block "title" .}}PhraseForge{{end}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/ui/theme-init.js" data-key="phraseforge"></script>
  <style>
    /* Blue/gray palette. Light is the default; dark overrides via
       :root[data-theme="dark"] so the toggle only ever has to flip one
       attribute on <html>. */
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --surface-alt: #e9ebee;
      --border: #d7dae0;
      --text: #1f2430;
      --muted: #6b7280;
      --link: #3b5bab;
      --link-hover: #2f4a8c;
      --btn-bg: #3b5bab;
      --btn-bg-hover: #2f4a8c;
      --danger: #b3453f;
      --danger-hover: #9c3b36;
      --success: #3f8a5c;
    }
    :root[data-theme="dark"] {
      /* softer dark slate, not near-black — easier on the eyes for reading text */
      --bg: #1c1f26;
      --surface: #242830;
      --surface-alt: #2b303a;
      --border: #3a3f4a;
      --text: #dfe3e8;
      --muted: #8b93a1;
      --link: #7b9bd1;
      --link-hover: #9db7de;
      --btn-bg: #4a6fa5;
      --btn-bg-hover: #5c85bd;
      --danger: #c17b74;
      --danger-hover: #cf8f89;
      --success: #7fb894;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    /* Until dp-shell is defined its content would show unstyled. Not
       visibility: hidden, which would stop the login page's autofocus from
       taking effect: a field that cannot be focused loses it. */
    dp-shell:not(:defined) { opacity: 0; }
    body {
      margin: 0; color: var(--text); background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 17px;
    }

    /* The top bar itself is dp-shell's (with its theme and sidebar buttons);
       these style the page's own content in its slots. */
    a.brand { font-weight: 700; font-size: 1.15rem; color: var(--text); text-decoration: none; }
    .user { display: flex; align-items: center; gap: 1rem; font-size: 0.95rem; color: var(--muted); }
    .user a { color: var(--muted); text-decoration: none; }
    .user a:hover { color: var(--link); }
    /* The user name gives way (with an ellipsis) when the top bar is short of
       room, as on a phone; "Log out" stays whole. */
    .user { min-width: 0; }
    #userLink { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #logoutLink { flex: none; white-space: nowrap; }

    #sidebar select#language-filter { margin-bottom: 1rem; }

    .content h1 { font-size: 1.9rem; margin: 0 0 1.5rem; }

    /* The Usage section: its filters above a table, and a heading with a button. */
    .usage-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.5rem; margin-bottom: 1rem; }
    .usage-filter { display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; }
    .usage-filter select { max-width: 16rem; }
    .usage-heading { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
    .usage-heading h1 { margin: 0; }

    /* login/signup page (no sidebar, no user session yet): dp-shell is given
       the centered attribute, which centres its main area; this wrapper only
       gives the page's CSS a hook, so its children are laid out as if they
       were the shell's own. */
    .auth-page { display: contents; } /* its children are laid out by dp-shell's centered main */
    .auth-page h1 { font-size: 1.9rem; margin: 0 0 1.5rem; }
    .auth-page .form-card { width: 100%; max-width: 24rem; text-align: left; }
    .auth-page .switch-link { margin-top: 1rem; color: var(--muted); font-size: 0.95rem; }
    .auth-page .switch-link a { color: var(--link); text-decoration: none; }
    .auth-page .switch-link a:hover { text-decoration: underline; }

    /* card grid for the text list */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 1.25rem; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 0.6rem;
      padding: 1.5rem; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    /* The content a page puts in the confirm dialog (the Jobs page's View
       action, the review and export dialogs) is the page's own, in the light
       DOM of dp-dialog, so the page styles it. dp-dialog spaces its direct
       children evenly itself. */
    dp-dialog h3 { margin: 0 0 0.35rem; font-size: 0.95rem; }
    dp-dialog dl { display: grid; grid-template-columns: auto 1fr; gap: 0.4rem 0.75rem; margin: 0; }
    dp-dialog dt { font-weight: 600; white-space: nowrap; }
    dp-dialog dd { margin: 0; word-break: break-word; }
    dp-dialog pre { margin: 0; padding: 0.6rem; background: var(--surface-alt); border-radius: 0.4rem; max-height: 24rem; overflow: auto; white-space: pre-wrap; word-break: break-word; }

    /* The content of a card is styled by the page: a dp-card's slotted
       children stay in this document, so these rules reach them. */
    .card h2, dp-card h2 { margin: 0 0 0.5rem; font-size: 1.2rem; }
    .card h2 a, dp-card h2 a { color: var(--text); text-decoration: none; }
    .card h2 a:hover, dp-card h2 a:hover { color: var(--link); }
    .card .meta, dp-card .meta { color: var(--muted); font-size: 0.9rem; }
    .empty-state { color: var(--muted); font-size: 1.1rem; }
    .empty-state a { color: var(--link); }

    /* forms */
    .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 0.6rem; padding: 2rem; max-width: 40rem; }
    textarea, input[type=text], input[type=password], input[type=url], input[type=number], input[type=file], select {
      width: 100%; padding: 0.65rem 0.75rem; margin-bottom: 1rem; border: 1px solid var(--border);
      border-radius: 0.4rem; font-size: 1.05rem; font-family: inherit; background: var(--surface); color: var(--text);
    }
    /* input[type=file]'s own browse button is a separate pseudo-element,
       untouched by the shared rule above (which only styles the input's
       own box) — styled to match dp-button's secondary variant so it
       doesn't look like a bare, unstyled OS-native button. */
    input[type=file]::file-selector-button {
      padding: 0.45rem 0.9rem; margin-right: 0.75rem; border: 1px solid var(--border); border-radius: 0.4rem;
      font-size: 0.95rem; font-family: inherit; background: var(--surface-alt); color: var(--text); cursor: pointer;
    }
    input[type=file]::file-selector-button:hover { background: var(--border); }
    .field-row { display: flex; gap: 1rem; }
    .field-row > * { flex: 1; }
    .form-actions { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    .form-actions select { width: auto; min-width: 9rem; margin: 0; padding: 0.45rem 0.75rem; }
    .transcribe-action { display: none; }
    label.field-label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.3rem; }
    table.admin-table { width: 100%; border-collapse: collapse; margin-bottom: 2rem; }
    table.admin-table th, table.admin-table td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); }
    table.admin-table th { color: var(--muted); font-size: 0.85rem; font-weight: 600; }
    .badge { display: inline-block; background: var(--surface-alt); border-radius: 0.3rem; padding: 0.15rem 0.5rem; font-size: 0.85rem; }
    a.tag-link { color: var(--muted); text-decoration: none; margin-left: 0.35rem; }
    a.tag-link:hover { color: var(--link); background: var(--border); }
    .snippet-list { display: grid; gap: 1rem; }
    table.admin-table dp-button, .snippet-list dp-button { --dp-button-padding: 0.35rem 0.9rem; --dp-button-font-size: 0.9rem; }
    .snippet-list .form-actions { gap: 1rem; align-items: baseline; font-size: 0.9rem; }
    .snippet-title { margin: 0 0 0.75rem; font-size: 1.1rem; }
    .snippet-text { margin: 0 0 1rem; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.9rem; }
    .link-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.9rem; padding: 0; text-decoration: underline; }
    .link-btn:disabled { color: var(--muted); cursor: default; text-decoration: none; }
    textarea { height: 20rem; font-family: ui-monospace, "SF Mono", monospace; font-size: 0.95rem; }
    .btn {
      display: inline-block; background: var(--btn-bg); color: #fff; border: none;
      padding: 0.65rem 1.4rem; border-radius: 0.4rem; font-size: 1rem; font-weight: 600; cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: var(--btn-bg-hover); }
    .btn-secondary { background: var(--surface-alt); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    /* Detail-view header: action buttons sit in their own wrapping row above
       the title, so a long title (or many buttons) never squeezes the other. */
    .resource-header { margin-bottom: 0.5rem; }
    .resource-actions { display: flex; align-items: center; justify-content: flex-start; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .resource-actions form { margin: 0; }
    .resource-actions .btn { width: 5rem; padding: 0.45rem 0; text-align: center; white-space: nowrap; }
    .copy-source { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: var(--danger-hover); }
    .back-link { display: inline-block; margin-bottom: 1rem; color: var(--muted); text-decoration: none; }

    /* bottom status bar: every form's success/error feedback lands here,
       instead of each page picking its own inline spot for it. */
    .status-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      display: flex; align-items: center; justify-content: center; gap: 1rem;
      padding: 0.85rem 1.5rem; font-size: 0.95rem; color: #fff;
      animation: status-bar-in 0.15s ease;
    }
    .status-bar.success { background: var(--success); }
    .status-bar.error { background: var(--danger); }
    .status-bar button.status-close {
      background: none; border: none; color: #fff; opacity: 0.8; cursor: pointer;
      font-size: 1.1rem; line-height: 1; padding: 0;
    }
    .status-bar button.status-close:hover { opacity: 1; }
    @keyframes status-bar-in { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .back-link:hover { color: var(--link); }

    /* reading view: big, comfortable, fills the column (no artificial narrow cap) */
    article.prose { font-size: 1.15rem; line-height: 1.7; }
    .prose-enlarged { font-size: 1.4rem; line-height: 1.9; } /* CJK/Arabic/Hebrew/Syriac read poorly at Latin body size; not scoped to article so it also works on table cells (vocabulary view) */
    /* article.prose (one element + one class) outranks .prose-enlarged (one
       class alone) on specificity, so the two rules above silently produce
       1.15rem — not 1.4rem — wherever both classes land on the same
       <article> (every View-page tab). This compound rule wins there
       specifically, without touching .prose-enlarged's own lower-specificity
       use on table cells, which has no competing element+class rule to lose
       against. */
    article.prose.prose-enlarged { font-size: 1.4rem; line-height: 1.9; }
    article.prose[dir="rtl"] .vocabulary-item { flex-direction: row-reverse; text-align: right; }
    article.prose h1 { font-size: 1.8em; }
    article.prose h2 { font-size: 1.5em; margin-top: 1.5em; }
    article.prose p { margin: 1em 0; }
    article.prose .vocabulary, article.prose .dialog { margin: 2rem 0; font-size: 1rem; }
    /* cli-tools always emits a content-type letter badge (T/V/D/...) right
       before each block. Rather than hide it, style it as a small round
       icon so it reads as a deliberate label instead of a raw letter. */
    article.prose .block-marker { display: inline-block; margin: 0 0 0.35rem; }
    article.prose .block-marker .ct-badge {
        display: inline-flex; align-items: center; justify-content: center;
        width: 1.5rem; height: 1.5rem; border-radius: 50%;
        background: var(--btn-bg); color: #fff;
        font-size: 0.75rem; font-weight: 600; line-height: 1;
    }
    article.prose .vocabulary-item { display: flex; gap: 1rem; padding: 0.4rem 0; border-bottom: 1px solid var(--border); }
    article.prose .vocabulary-phrase { font-weight: 700; min-width: 12rem; }
    article.prose .dialog-item {
      display: flex; gap: 0.6rem; align-items: baseline;
      margin-bottom: 1rem; padding: 0.75rem 1rem; background: var(--surface-alt); border-radius: 0.5rem;
    }
    article.prose .dialog-header { font-weight: 700; color: var(--muted); flex-shrink: 0; }
    article.prose .dialog-content { flex: 1; min-width: 0; }
    article.prose .dialog-content p { margin: 0; } /* header+content sit on one line, not stacked as two blocks */
    /* No explicit row-reverse for RTL: .dialog-item already inherits
       direction:rtl from its dir="rtl" ancestor, which alone reverses the
       default flex-direction:row visually (dash ends up on the right, at
       the start of the RTL line). Adding row-reverse on top double-reverses
       it back to LTR-looking order — that was the earlier bug. */


    /* Source/Transcription/Translation editor tabs (new.html/edit.html) and
       their read-only counterpart (view.html). */
    .editor-tabs { display: flex; gap: 0.25rem; margin-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
    .editor-tab-btn {
      background: none; border: none; border-bottom: 2px solid transparent; padding: 0.5rem 0.9rem;
      font-size: 0.95rem; color: var(--muted); cursor: pointer;
    }
    .editor-tab-btn.active { color: var(--link); border-bottom-color: var(--link); font-weight: 600; }

    /* dialog-vocabulary-models-generation: a Text/Dialog view's row of
       links to its linked Vocabulary/Models list, right-aligned next to
       the tab strip (visually separated, not interleaved with the tabs
       themselves) — shown even when there are no tabs to show. When
       .editor-tabs is absent, .linked-lists is this row's only flex child,
       and margin-left:auto still pushes it flush right against the empty
       remaining space. */
    .editor-tabs-row { display: flex; align-items: flex-end; gap: 1rem; margin-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
    .editor-tabs-row .editor-tabs { margin-bottom: 0; border-bottom: none; }
    .linked-lists { display: flex; gap: 0.75rem; margin-left: auto; padding-bottom: 0.5rem; }
    .linked-lists a { font-size: 0.85rem; }

    .editor-tab-pane textarea { height: 18rem; }
    /* Vocabulary table: with auto layout a long translation takes all the width and CJK text,
       which can wrap anywhere, collapses the other columns to a character per line. Phrase,
       translation and notes keep a readable minimum (the wrapper scrolls on a narrow screen). */
    .vocab-items-table th:nth-child(1), .vocab-items-table td:nth-child(1) { min-width: 8.5rem; } /* five CJK characters in the enlarged font (5 x 1.4rem) plus the cell padding */
    .vocab-items-table th:nth-child(4), .vocab-items-table td:nth-child(4) { min-width: 11rem; }
    .vocab-items-table th:nth-child(5), .vocab-items-table td:nth-child(5) { min-width: 15rem; }
    /* Examples below the notes: the notes' own size and color. Each line keeps the script's direction
       (dir is set on the block); the block is only as wide as its longest line, so in an LTR table it
       starts where the notes start instead of sitting at the far edge of the cell. */
    .vocab-examples { margin-top: 0.35rem; width: fit-content; max-width: 100%; }
    .vocab-example + .vocab-example { margin-top: 0.15rem; }
    /* Review dialog (vocabulary view): one block per proposal. */
    .review-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem 1rem; }
    .review-dialog > * + * { margin-top: 0.75rem; }
    .review-head h2 { margin: 0; font-size: 1.5rem; }
    .review-warning { border: 1px solid var(--danger); color: var(--danger); border-radius: 0.4rem; padding: 0.5rem 0.75rem; }
    .review-message { color: var(--muted); }
    .review-item { border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.6rem 0.8rem; }
    .review-item.is-done { opacity: 0.6; }
    .review-item-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin-bottom: 0.4rem; }
    .review-status { margin-inline-start: auto; color: var(--muted); font-size: 0.85rem; }
    .review-values { display: grid; grid-template-columns: max-content 1fr; gap: 0.2rem 0.75rem; align-items: baseline; }
    .review-values dt { color: var(--muted); font-size: 0.85rem; margin: 0; }
    /* start-aligned and shrunk to the text, so right-to-left text sits next to its label */
    .review-values dd { margin: 0; overflow-wrap: anywhere; justify-self: start; }
    .review-reason { color: var(--muted); font-size: 0.9rem; margin-top: 0.4rem; }
    .review-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .review-footer { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .review-row { display: flex; flex-wrap: wrap; gap: 0.25rem 1.5rem; margin: 0.5rem 0; }
    .review-values dd.review-long { white-space: pre-wrap; max-height: 12rem; overflow: auto; }
    .actions-cell { white-space: nowrap; border-bottom: 1px solid var(--border); padding: 0.5rem; }
    .vocab-items-table dp-button, .models-items-table dp-button { margin-right: 0.3rem; }
    .vocab-items-table dp-button, .models-items-table dp-button, .vocab-hidden-toggle dp-button { --dp-button-padding: 0.35rem 0.7rem; --dp-button-font-size: 0.9rem; }
    .vocab-hidden-toggle { margin-top: 1rem; }
    .vocab-items-table tr.vocab-hidden { display: none; }
    .vocab-items-table.show-hidden tr.vocab-hidden { display: table-row; opacity: 0.55; }
    /* Same size and font as the other form fields (an input's own rule outranks the script class,
       a textarea's does not, so without this the Arabic font would make it larger than the phrase
       field); direction and alignment still come from the script. */
    #field-examples { height: 7rem; font-size: 1.05rem; font-family: inherit; }
    .vocab-hint { margin-top: 0.3rem; font-size: 0.8rem; color: var(--muted); }
    .editor-tab-pane textarea.editor-enlarged { font-size: 1.4rem; } /* CJK/Arabic/Hebrew/Syriac need a bigger base size to read while typing */
  </style>
  {{block "extra_head" .}}{{end}}
  <script type="module" src="/ui/dp-core.js"></script>
  <script src="/static/components/pf-tag-picker/component.js"></script>
  <script src="/static/components/pf-llm-performance/component.js"></script>
  <script src="/static/components/pf-llm-purge/component.js"></script>
</head>
<body>
  <dp-shell storage-key="phraseforge" theme-toggle theme-label="{{call .T "theme.toggle"}}"{{if not .User}} centered{{end}}>
    <a slot="brand" class="brand" href="/">PhraseForge</a>
    {{if .User}}
    <dp-tabs slot="header" id="mainNav" variant="underline"></dp-tabs>
    <div slot="actions" class="user">
      <a id="userLink" href="#"></a>
      <a id="logoutLink" href="/logout"></a>
    </div>
    <!-- Built entirely by shell.js from window.__PF_APP_BOOTSTRAP__.chrome —
         see specs/features/phraseforge-spa-unified-shell.md. -->
    <div slot="sidebar" id="sidebar"></div>
    <div class="content">
      {{block "content" .}}{{end}}
    </div>
    {{else}}
    <div class="auth-page">
      {{block "content" .}}{{end}}
    </div>
    {{end}}
    <dp-status-bar slot="footer" id="statusBar"></dp-status-bar>
  </dp-shell>
  {{if .Message}}
  <div class="status-bar {{.MessageType}}" id="status-bar" role="status">
    <span>{{.Message}}</span>
    <button type="button" class="status-close" onclick="document.getElementById('status-bar').remove()" aria-label="Dismiss">×</button>
  </div>
  {{end}}
  <dp-dialog id="confirmDialog"></dp-dialog>
  <script>
    function phraseforgeCopyMarkdown(id, button) {
      var source = document.getElementById(id);
      if (!source) { return; }
      var text = source.value || source.textContent || '';
      var done = function () {
        var original = button.textContent;
        button.textContent = 'Copied';
        setTimeout(function () { button.textContent = original; }, 1400);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done);
      } else {
        source.removeAttribute('readonly');
        source.select();
        document.execCommand('copy');
        source.setAttribute('readonly', 'readonly');
        done();
      }
    }
    function phraseforgeCopyActiveMarkdown(button) {
      var active = document.querySelector('.editor-tab-btn.active');
      var tab = active ? active.getAttribute('data-tab') : 'source';
      phraseforgeCopyMarkdown('copy-' + tab + '-markdown', button);
    }
    // The language filter is now built and driven entirely by shell.js
    // (phraseforge-spa-unified-shell) — no page-reload mechanism left here.
    (function () {
      var bar = document.getElementById('status-bar');
      if (bar) { setTimeout(function () { bar.remove(); }, 5000); }
    })();
    // Replaces native confirm() for every form marked data-confirm: shows
    // dp-dialog instead, and only actually submits if the user confirms.
    // confirm() is async (a Promise), which a synchronous onsubmit="return
    // confirm(...)" handler could never await — so this intercepts the real
    // submit event instead. form.submit() (the native method, NOT
    // requestSubmit()) is used deliberately: it does not re-dispatch a
    // "submit" event, so this listener can't re-trigger itself and needs no
    // re-entrancy guard.
    function phraseforgeWireConfirmForms() {
      document.querySelectorAll('form[data-confirm]').forEach(function (form) {
        form.addEventListener('submit', function (event) {
          event.preventDefault();
          var dialog = document.getElementById('confirmDialog');
          dialog.confirm(form.dataset.confirm, { danger: form.dataset.confirmDanger === 'true' }).then(function (ok) {
            if (ok) { form.submit(); }
          });
        });
      });
    }
    phraseforgeWireConfirmForms();
  </script>
</body>
</html>
{{end}}
