# The providers and models PhraseForge can call (PHRASEFORGE_MODELS_FILE;
# /etc/phraseforge/models.yaml in the cluster). A purpose in config.yaml lists
# model_tags; a call goes to the highest-priority available model that has all
# of them, and falls back to a lower one when it fails.
providers:
  - id: ollama
    type: ollama
    base_url: http://host.docker.internal:11434
    # Compulsory on every provider; the value may be empty. "" means no
    # credential; env:NAME reads the environment variable NAME (a restart is
    # needed to see a change) and file:/absolute/path reads the file, re-read on
    # every call (for an Ollama behind an
    # authenticating proxy: sent as a Bearer key). Never put the key in this
    # file. The same field exists on openai (optional), anthropic and vertex
    # (needed: without one the provider is skipped, reason missing_credentials,
    # never fatal).
    # api_key_from: env:OLLAMA_API_KEY
    api_key_from: ""
models:
  - id: gemma4-12b
    provider: ollama
    model: gemma4:12b
    tags: [default]
    priority: 10
    options:
      # The most this model is run with; a purpose's numCtx must not exceed it.
      num_ctx: 16384
      # Streaming no-progress limits: wait for the first output (model load +
      # prompt eval), then the longest gap between outputs.
      first_token_timeout_seconds: 300
      idle_timeout_seconds: 60
