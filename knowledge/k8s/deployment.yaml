---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge
  template:
    metadata:
      labels:
        app: knowledge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: knowledge
          image: k8s-lab-registry:5000/knowledge:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8300
          env:
            - name: QDRANT_URL
              value: http://qdrant.data.svc.cluster.local:6333
            - name: EMBEDDINGS_PROVIDER
              value: ollama
            - name: EMBEDDINGS_BASE_URL
              value: http://host.docker.internal:11434
            - name: EMBEDDINGS_MODEL
              value: nomic-embed-text
            - name: EMBEDDINGS_DIMENSION
              value: "768"
            - name: CHAT_PROVIDER
              value: ollama
            - name: CHAT_BASE_URL
              value: http://host.docker.internal:11434
            - name: CHAT_MODEL
              value: gemma4:e4b
            - name: PGHOST
              value: postgres.data.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: knowledge
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /ready
              port: 8300
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8300
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge
  namespace: app
spec:
  selector:
    app: knowledge
  ports:
    - port: 8300
      targetPort: 8300
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledge
  namespace: app
spec:
  ingressClassName: traefik
  rules:
    - host: knowledge.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: knowledge
                port:
                  number: 8300
