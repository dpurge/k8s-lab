---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledge
  template:
    metadata:
      labels:
        app: knowledge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: knowledge
          image: k8s-lab-registry:5000/knowledge:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8300
          env:
            - name: PGHOST
              value: postgres.data.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: knowledge
            - name: QDRANT_URL
              value: http://qdrant.data.svc.cluster.local:6333
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            # Provider API keys: optional. They come from the Secret knowledge-llm-keys,
            # which `task llm-enable` or you create; without it these variables are
            # unset. models.yaml names one through api_key_from: env:NAME, and the
            # embeddings block of config.yaml reads the key of its provider. A key
            # never goes in a manifest.
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: knowledge-llm-keys
                  key: OLLAMA_API_KEY
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: knowledge-llm-keys
                  key: OPENROUTER_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: knowledge-llm-keys
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: knowledge-llm-keys
                  key: OPENAI_API_KEY
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/knowledge
              readOnly: true
            - name: vertex
              mountPath: /etc/knowledge-vertex
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 8300
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8300
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        # config.yaml (knowledge-config) and models.yaml (knowledge-models, built by
        # the Taskfile from models.dev.yaml or a generated file) in one directory.
        - name: config
          projected:
            sources:
              - configMap:
                  name: knowledge-config
              - configMap:
                  name: knowledge-models
        # The access token for Vertex AI, written by `task llm-enable`; models.yaml
        # names it as the vertex provider's api_key_from (file:). Optional so the pod
        # starts without it; the provider is then skipped (missing_credentials).
        - name: vertex
          secret:
            secretName: knowledge-vertex
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge
  namespace: app
spec:
  selector:
    app: knowledge
  ports:
    - port: 8300
      targetPort: 8300
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledge
  namespace: app
spec:
  ingressClassName: traefik
  rules:
    - host: knowledge.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: knowledge
                port:
                  number: 8300
