<!doctype html>
<html lang="en">
  <head>
    <script src="/theme.js"></script>
    <script src="/components/kb-button/component.js"></script>
    <script src="/components/kb-field/component.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Knowledge — Log in</title>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body>
    <kb-button class="top" variant="icon" onclick="toggleTheme()" title="Toggle theme">🌓</kb-button>
    <form id="form">
      <h1>Log in</h1>
      <kb-field label="Email" for="email">
        <input id="email" type="email" required autofocus />
      </kb-field>
      <kb-field label="Password" for="password">
        <input id="password" type="password" required minlength="8" />
      </kb-field>
      <div class="error" id="error"></div>
      <kb-button type="submit">Log in</kb-button>
      <p class="muted">No account? <a href="/signup.html">Sign up</a></p>
    </form>
    <script src="/auth.js"></script>
    <script>
      wireAuthForm("/api/v1/auth/login", "Log in failed");
    </script>
  </body>
</html>
