<!doctype html>
<html lang="en">
  <head>
    <script src="/theme.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Knowledge — Log in</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --border: #ddd;
        --muted: #666;
        --danger: #b00020;
      }
      :root[data-theme="dark"] {
        --bg: #1a1a1a;
        --fg: #e6e6e6;
        --border: #3a3a3a;
        --muted: #a0a0a0;
        --danger: #ff6b81;
      }
      body {
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      form {
        width: 320px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.5rem;
      }
      h1 {
        margin-top: 0;
        font-size: 1.25rem;
      }
      label {
        display: block;
        margin-bottom: 0.75rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.5rem;
        margin-top: 0.25rem;
        font: inherit;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 0.6rem;
        font: inherit;
        cursor: pointer;
      }
      .error {
        color: var(--danger);
        min-height: 1.2rem;
        font-size: 0.9rem;
      }
      .muted {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .top {
        position: absolute;
        top: 1rem;
        right: 1rem;
      }
    </style>
  </head>
  <body>
    <button class="top" type="button" onclick="toggleTheme()" title="Toggle theme">🌓</button>
    <form id="form">
      <h1>Log in</h1>
      <label>
        Email
        <input id="email" type="email" required autofocus />
      </label>
      <label>
        Password
        <input id="password" type="password" required minlength="8" />
      </label>
      <div class="error" id="error"></div>
      <button type="submit">Log in</button>
      <p class="muted">No account? <a href="/signup.html">Sign up</a></p>
    </form>
    <script>
      document.getElementById("form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const errorEl = document.getElementById("error");
        errorEl.textContent = "";
        try {
          const response = await fetch("/api/v1/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: document.getElementById("email").value,
              password: document.getElementById("password").value,
            }),
          });
          if (!response.ok) {
            const body = await response.json().catch(() => ({}));
            throw new Error(body.error?.message || "Log in failed");
          }
          location.href = "/";
        } catch (error) {
          errorEl.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
