<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Knowledge — Log in</title>
    <script src="/ui/theme-init.js" data-key="kb"></script>
    <link rel="stylesheet" href="/ui/tokens.css" />
    <link rel="stylesheet" href="/auth.css" />
    <script type="module" src="/ui/dp-core.js"></script>
  </head>
  <body>
    <dp-shell storage-key="kb" theme-toggle theme-label="Toggle theme" centered>
      <a slot="brand" class="brand" href="/">Knowledge</a>
      <div class="auth-page">
        <h1>Log in</h1>
        <div class="form-card">
          <form id="form">
            <dp-field label="Email" for="email">
              <input id="email" type="email" required autofocus />
            </dp-field>
            <dp-field label="Password" for="password">
              <input id="password" type="password" required />
            </dp-field>
            <div class="error" id="error"></div>
            <dp-button variant="primary" type="submit" block>Log in</dp-button>
          </form>
        </div>
        <p class="switch-link">No account? <a href="/signup.html">Sign up</a></p>
      </div>
    </dp-shell>
    <script src="/auth.js"></script>
    <script>
      wireAuthForm("/api/v1/auth/login", "Log in failed");
    </script>
  </body>
</html>
