<!doctype html>
<html lang="en">
  <head>
    <script src="/theme.js"></script>
    <script src="/vendor/markdown-it.min.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script src="/components/kb-button/component.js"></script>
    <script src="/components/kb-nav/component.js"></script>
    <script src="/components/kb-status-bar/component.js"></script>
    <script src="/components/kb-dialog/component.js"></script>
    <script src="/components/kb-card/component.js"></script>
    <script src="/components/kb-field/component.js"></script>
    <script src="/components/kb-message/component.js"></script>
    <script src="/components/kb-job-card/component.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Knowledge</title>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header>
      <kb-nav id="mainNav"></kb-nav>
      <a href="http://qdrant.localhost:8080/dashboard" target="_blank" rel="noreferrer">Qdrant ↗</a>
      <div class="spacer"></div>
      <span class="muted" id="userEmail"></span>
      <kb-button variant="icon" onclick="toggleTheme()" title="Toggle theme">🌓</kb-button>
      <kb-button variant="secondary" onclick="run(logout)">Log out</kb-button>
    </header>

    <section id="knowledgeTab" class="tab active">
      <aside>
        <h1>Knowledge</h1>
        <input id="q" placeholder="Semantic search query" />
        <input id="filterTags" placeholder="Filter tags: k8s, qdrant" />
        <kb-field label="Updated after" for="start">
          <input id="start" type="datetime-local" />
        </kb-field>
        <kb-field label="Updated before" for="end">
          <input id="end" type="datetime-local" />
        </kb-field>
        <div class="actions">
          <kb-button onclick="run(loadList)">Search</kb-button>
          <kb-button onclick="newItem()">New</kb-button>
        </div>
        <hr class="aside-divider" />
        <input id="exportTags" placeholder="Export tags: k8s, qdrant (empty = all)" />
        <div class="actions">
          <kb-button onclick="exportItems()">Export</kb-button>
          <kb-button onclick="$('importFile').click()">Import</kb-button>
          <input id="importFile" type="file" accept=".yaml,.yml,application/yaml,text/yaml" style="display: none" onchange="run(importFile)" />
        </div>
      </aside>

      <main>
        <div id="knowledgeListView" class="view active">
          <div id="list"></div>
          <div class="actions">
            <kb-button variant="secondary" id="listPrev" onclick="run(loadListPrev)">← Prev</kb-button>
            <kb-button variant="secondary" id="listNext" onclick="run(loadListNext)">Next →</kb-button>
          </div>
        </div>

        <div id="knowledgeDetailView" class="view">
          <a class="back-link" onclick="showKnowledgeView('list')">← Back to list</a>
          <input id="id" type="hidden" />
          <kb-field label="Title" for="title">
            <input id="title" />
          </kb-field>
          <div class="actions">
            <kb-button type="button" onclick="run(generateTitle)">Generate</kb-button>
          </div>
          <kb-field label="Tags" for="tags">
            <input id="tags" placeholder="k8s, qdrant, rag" />
          </kb-field>
          <kb-field label="Summary" for="summary">
            <textarea id="summary" style="min-height: 5rem"></textarea>
          </kb-field>
          <div class="actions">
            <kb-button type="button" onclick="run(generateSummary)">Generate</kb-button>
          </div>
          <kb-field label="Body (Markdown)" for="body">
            <textarea id="body"></textarea>
          </kb-field>
          <div class="actions">
            <kb-button onclick="run(save)">Save</kb-button>
            <kb-button variant="danger" onclick="run(removeItem)">Delete</kb-button>
          </div>
        </div>
      </main>
    </section>

    <section id="chatTab" class="tab">
      <aside>
        <h1>Chats</h1>
        <kb-field label="New chat title" for="newChatTitle">
          <input id="newChatTitle" />
        </kb-field>
        <kb-field label="Scope tags" for="newChatTags">
          <input id="newChatTags" placeholder="empty = all knowledge" />
        </kb-field>
        <div class="actions">
          <kb-button onclick="run(createChat)">Create chat</kb-button>
        </div>
        <div id="chats"></div>
      </aside>

      <main>
        <h1 id="chatTitle">Select or create a chat</h1>
        <div id="chatScope" class="muted"></div>
        <div class="actions">
          <kb-button variant="danger" onclick="run(deleteChat)">Delete chat</kb-button>
        </div>
        <div id="chatMessages"></div>
        <textarea
          id="chatInput"
          placeholder="Ask your knowledge... Enter sends, Shift+Enter inserts a new line."
          style="min-height: 6rem"
        ></textarea>
        <div class="muted">Enter sends · Shift+Enter inserts a new line</div>
        <div class="actions">
          <kb-button onclick="run(sendChat)">Send</kb-button>
        </div>
      </main>
    </section>

    <section id="ingestTab" class="tab">
      <aside>
        <h1>Ingest</h1>
        <input id="ingestUrl" placeholder="URL to ingest" />
        <input id="ingestTags" placeholder="Tags: k8s, qdrant" />
        <div class="actions">
          <kb-button onclick="run(startIngestUrl)">Ingest URL</kb-button>
          <kb-button onclick="$('ingestFile').click()">Upload file</kb-button>
          <input
            id="ingestFile"
            type="file"
            accept=".txt,.md,.markdown"
            style="display: none"
            onchange="run(startIngestFile)"
          />
        </div>
        <div class="actions">
          <kb-button onclick="run(refreshIngestLists)">Refresh</kb-button>
        </div>
      </aside>

      <main>
        <div id="ingestListView" class="view active">
          <kb-nav id="ingestSubNav"></kb-nav>
          <div class="subview active" id="ingestDraftsSection">
            <div id="drafts"></div>
          </div>
          <div class="subview" id="ingestJobsSection">
            <div id="jobs"></div>
          </div>
        </div>

        <div id="ingestDetailView" class="view">
          <a class="back-link" onclick="showIngestView('list')">← Back to list</a>
          <input id="draftId" type="hidden" />
          <div id="draftSource" class="muted"></div>
          <kb-field label="Title" for="draftTitle">
            <input id="draftTitle" />
          </kb-field>
          <kb-field label="Tags" for="draftTags">
            <input id="draftTags" placeholder="k8s, qdrant, rag" />
          </kb-field>
          <kb-field label="Summary" for="draftSummary">
            <textarea id="draftSummary" style="min-height: 5rem"></textarea>
          </kb-field>
          <kb-field label="Body" for="draftBody">
            <textarea id="draftBody"></textarea>
          </kb-field>
          <div class="actions">
            <kb-button onclick="run(saveDraft)">Save</kb-button>
            <kb-button onclick="run(approveDraft)">Approve</kb-button>
            <kb-button variant="danger" onclick="run(discardDraft)">Discard</kb-button>
          </div>
        </div>
      </main>
    </section>

    <footer id="status">
      <kb-status-bar id="statusBar"></kb-status-bar>
    </footer>
    <kb-dialog id="confirmDialog"></kb-dialog>

    <script src="/app.js"></script>
  </body>
</html>
