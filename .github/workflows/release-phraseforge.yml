# Build and release the phraseforge app: Linux/Windows binaries attached to a
# GitHub release, plus a Docker image pushed to GHCR. Runs only when
# phraseforge/ actually changed — this repo hosts multiple independent
# components (see also release-dictionary.yml), each releasing on its own.
#
# Versioning is CalVer: phraseforge-v<year>.<month>.<micro>, where <micro>
# auto-increments within the current month based on existing git tags (see the
# "Compute version" step) — same scheme as
# https://github.com/dpurge/cli-tools/blob/main/.github/workflows/release.yml,
# namespaced with a "phraseforge-" tag prefix so phraseforge's and
# dictionary's independent version sequences (and any future component's)
# can't collide on the same tag in this shared repo.
#
# NOTE: the GitHub release is created as a DRAFT (publish it manually) —
# matching cli-tools' convention (there, via .goreleaser.yml's release.draft).
#
# The changelog is stamped at release time: scripts/release-stamp.sh (through
# scripts/stamp-changelog.mjs) moves phraseforge/CHANGELOG.md's [Unreleased]
# entries under the new version, commits that with "[skip ci]" and tags that
# commit. What CI tests lives in scripts/ci-test.sh, which `task ci-local` also
# runs on a clean copy of the tree. shared/** is listed because phraseforge builds
# with the shared module (go.mod replace, Docker context shared=./shared), so a
# change there must release it.
name: release-phraseforge

on:
  push:
    branches: [main]
    paths:
      - 'phraseforge/**'
      - 'shared/**'
      - '.github/workflows/release-phraseforge.yml'
      - 'scripts/ci-test.sh'
      - 'scripts/release-stamp.sh'
      - 'scripts/stamp-changelog.mjs'
  workflow_dispatch:

# Only one release run at a time; queue (do not cancel) concurrent merges so
# each gets its own sequential CalVer micro version.
concurrency:
  group: release-phraseforge
  cancel-in-progress: false

permissions:
  contents: write # create the git tag + the GitHub release
  packages: write # push the image to GHCR

defaults:
  run:
    working-directory: phraseforge

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags (needed for versioning)

      - name: Compute version (CalVer)
        id: version
        run: |
          git fetch --tags --quiet

          prefix="$(date -u +'%Y.%-m')"
          last_micro="$(git tag -l "phraseforge-v${prefix}.*" | sed -E "s/^phraseforge-v${prefix}\.([0-9]+)$/\1/" | sort -n | tail -1)"
          next_micro="${last_micro:-"-1"}"
          next_micro=$((next_micro + 1))

          tag="phraseforge-v${prefix}.${next_micro}"
          owner="${GITHUB_REPOSITORY_OWNER,,}" # GHCR requires a lowercase owner

          {
            echo "tag=${tag}"
            echo "version=${prefix}.${next_micro}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "image=ghcr.io/${owner}/phraseforge"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${tag}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: phraseforge/go.mod

      # shared/ui is embedded by the Go build; a clean checkout has only its
      # .gitkeep placeholder, so ci-test.sh compiles the real bundle first.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: shared/ui/package-lock.json

      # Builds shared/ui, then vets and tests; see scripts/ci-test.sh. Database tests skip
      # without their env vars; none calls a model.
      - name: Test
        working-directory: .
        run: bash scripts/ci-test.sh phraseforge

      - name: Stamp changelog, commit, tag and push
        working-directory: .
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/release-stamp.sh phraseforge "$VERSION"

      # Plain cross-compilation, not GoReleaser: phraseforge is a single
      # binary (no per-command build matrix to justify the extra tool/config),
      # so `go build` + a tar.gz/zip archive per OS is simpler and sufficient.
      - name: Build release binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o dist/phraseforge     .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/phraseforge.exe .
          tar -czf "dist/phraseforge_${VERSION}_linux_amd64.tar.gz" -C dist phraseforge
          (cd dist && zip -q "phraseforge_${VERSION}_windows_amd64.zip" phraseforge.exe)
          rm dist/phraseforge dist/phraseforge.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: phraseforge ${{ steps.version.outputs.version }}
          draft: true
          working_directory: phraseforge
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip

      # No corporate-CA step needed here: the Dockerfile's bind mount tolerates
      # .docker/corp-ca/ being empty, which is exactly its committed state —
      # only Taskfile.yml's local _build-image task ever puts a real bundle there.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: phraseforge
          build-contexts: shared=./shared
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
