# Build and release the assistant app: a tag and a Docker image pushed to GHCR.
# Runs only when assistant/ (or the shared module it builds with) changed — this
# repo hosts multiple independent components (see also release-phraseforge.yml),
# each releasing on its own.
#
# Versioning is CalVer, assistant-v<year>.<month>.<micro>, where <micro>
# auto-increments within the current month from the existing git tags, the same
# scheme as release-phraseforge.yml, namespaced with an "assistant-" tag prefix so
# the components' version sequences cannot collide in this shared repo.
#
# The changelog is stamped at release time: scripts/release-stamp.sh (through
# scripts/stamp-changelog.mjs) moves assistant/CHANGELOG.md's [Unreleased]
# entries under the new version, commits that with "[skip ci]" and tags that
# commit. What CI tests lives in scripts/ci-test.sh, which `task ci-local` also
# runs on a clean copy of the tree. shared/** is listed because assistant builds
# with the shared module (go.mod replace, Docker context shared=./shared), so a
# change there must release it.
name: release-assistant

on:
  push:
    branches: [main]
    paths:
      - 'assistant/**'
      - 'shared/**'
      - '.github/workflows/release-assistant.yml'
      - 'scripts/ci-test.sh'
      - 'scripts/release-stamp.sh'
      - 'scripts/stamp-changelog.mjs'
  workflow_dispatch:

# Only one release run at a time; queue (do not cancel) concurrent merges so
# each gets its own sequential CalVer micro version.
concurrency:
  group: release-assistant
  cancel-in-progress: false

permissions:
  contents: write # create the git tag
  packages: write # push the image to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags (needed for versioning)

      - name: Compute version (CalVer)
        id: version
        run: |
          git fetch --tags --quiet

          prefix="$(date -u +'%Y.%-m')"
          last_micro="$(git tag -l "assistant-v${prefix}.*" | sed -E "s/^assistant-v${prefix}\.([0-9]+)$/\1/" | sort -n | tail -1)"
          next_micro="${last_micro:-"-1"}"
          next_micro=$((next_micro + 1))

          tag="assistant-v${prefix}.${next_micro}"
          owner="${GITHUB_REPOSITORY_OWNER,,}" # GHCR requires a lowercase owner

          {
            echo "tag=${tag}"
            echo "version=${prefix}.${next_micro}"
            echo "image=ghcr.io/${owner}/assistant"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${tag}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: assistant/go.mod

      # shared/ui is embedded by the Go build; a clean checkout has only its
      # .gitkeep placeholder, so compile the real bundle before go vet/test.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: shared/ui/package-lock.json

      # Builds shared/ui, then vets and tests; see scripts/ci-test.sh. Tests that
      # need a database skip without ASSISTANT_TEST_DATABASE_URL; none calls a model.
      - name: Test
        run: bash scripts/ci-test.sh assistant

      - name: Stamp changelog, commit, tag and push
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/release-stamp.sh assistant "$VERSION"

      # No corporate-CA step needed here: the Dockerfile's bind mount tolerates
      # .docker/corp-ca/ being empty, which is exactly its committed state.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: assistant
          build-contexts: shared=./shared
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
