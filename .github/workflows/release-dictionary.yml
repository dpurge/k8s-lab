# Build and release the dictionary service: Linux/Windows binaries attached to
# a GitHub release, plus a Docker image pushed to GHCR. Runs only when
# dictionary/ actually changed — this repo hosts multiple independent
# components (see also release-phraseforge.yml), each releasing on its own.
#
# Versioning is CalVer: dictionary-v<year>.<month>.<micro>, where <micro>
# auto-increments within the current month based on existing git tags (see the
# "Compute version" step) — same scheme as
# https://github.com/dpurge/cli-tools/blob/main/.github/workflows/release.yml,
# namespaced with a "dictionary-" tag prefix so dictionary's and
# phraseforge's independent version sequences (and any future component's)
# can't collide on the same tag in this shared repo.
#
# NOTE: the GitHub release is created as a DRAFT (publish it manually) —
# matching cli-tools' convention (there, via .goreleaser.yml's release.draft).
name: release-dictionary

on:
  push:
    branches: [main]
    paths:
      - 'dictionary/**'
      - '.github/workflows/release-dictionary.yml'
  workflow_dispatch:

# Only one release run at a time; queue (do not cancel) concurrent merges so
# each gets its own sequential CalVer micro version.
concurrency:
  group: release-dictionary
  cancel-in-progress: false

permissions:
  contents: write # create the git tag + the GitHub release
  packages: write # push the image to GHCR

defaults:
  run:
    working-directory: dictionary

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags (needed for versioning)

      - name: Compute version (CalVer)
        id: version
        run: |
          git fetch --tags --quiet

          prefix="$(date -u +'%Y.%-m')"
          last_micro="$(git tag -l "dictionary-v${prefix}.*" | sed -E "s/^dictionary-v${prefix}\.([0-9]+)$/\1/" | sort -n | tail -1)"
          next_micro="${last_micro:-"-1"}"
          next_micro=$((next_micro + 1))

          tag="dictionary-v${prefix}.${next_micro}"
          owner="${GITHUB_REPOSITORY_OWNER,,}" # GHCR requires a lowercase owner

          {
            echo "tag=${tag}"
            echo "version=${prefix}.${next_micro}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "image=ghcr.io/${owner}/dictionary"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${tag}"

      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: dictionary/go.mod

      # Plain cross-compilation, not GoReleaser: dictionary is a single binary
      # (no per-command build matrix to justify the extra tool/config), so
      # `go build` + a tar.gz/zip archive per OS is simpler and sufficient.
      - name: Build release binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o dist/dictionary     .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/dictionary.exe .
          tar -czf "dist/dictionary_${VERSION}_linux_amd64.tar.gz" -C dist dictionary
          (cd dist && zip -q "dictionary_${VERSION}_windows_amd64.zip" dictionary.exe)
          rm dist/dictionary dist/dictionary.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: dictionary ${{ steps.version.outputs.version }}
          draft: true
          working_directory: dictionary
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip

      # No corporate-CA step needed here: the Dockerfile's bind mount tolerates
      # .docker/corp-ca/ being empty, which is exactly its committed state —
      # only Taskfile.yml's local _build-image task ever puts a real bundle there.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: dictionary
          build-contexts: shared=./shared
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
