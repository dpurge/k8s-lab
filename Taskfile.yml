# k8s-lab: local k3d-based Kubernetes dev cluster

version: "3"

# Applies `set -o errexit -o nounset -o pipefail` to every cmd's shell
set: [errexit, nounset, pipefail]

vars:
  CLUSTER_NAME: k8s-lab
  REGISTRY_NAME: k8s-lab-registry
  REGISTRY_PORT: "5000"
  INGRESS_PORT: "8080"
  ASSISTANT_TEST_DB_PORT: "15432"
  NATS_TEST_PORT: "14222"
  KUBECONFIG_PATH: .k3d/kubeconfig
  # Every kubectl call below goes through this instead of bare `kubectl`, so
  # it always targets this project's cluster only — via kubectl's own
  # --kubeconfig flag, not the KUBECONFIG env var.
  KUBECTL: 'kubectl --kubeconfig={{.KUBECONFIG_PATH}}'
  # The apps the llm-* tasks configure (each with its own <app>-models ConfigMap,
  # <app>-llm-keys and <app>-vertex Secrets and Deployment in namespace app).
  LLM_APPS: assistant phraseforge knowledge
  # Trusted inside the cluster node if present (see start-k8s); harmless if absent.
  CORP_CA_BUNDLE: /usr/local/munki/certs.pem
  ARGO_WORKFLOWS_VERSION: v4.1.3
  HEADLAMP_VERSION: v0.45.0
  HEADLAMP_IMAGE: 'ghcr.io/headlamp-k8s/headlamp:{{.HEADLAMP_VERSION}}'
  POSTGRES_IMAGE: pgvector/pgvector:0.8.7-pg18-trixie
  PGADMIN_IMAGE: dpage/pgadmin4:9.11.0
  QDRANT_IMAGE: qdrant/qdrant:v1.19.0
  GARAGE_IMAGE: dxflrs/garage:v2.3.0
  NATS_IMAGE: nats:2.14.6-alpine
  # Depends on ARGO_WORKFLOWS_VERSION above — root vars may reference earlier ones.
  ARGO_WORKFLOWS_MANIFEST: '.k3d/argo-workflows-namespace-install-{{.ARGO_WORKFLOWS_VERSION}}.yaml'

tasks:

  start-k8s:
    desc: Create or resume the k3d cluster, registry, and ingress.
    cmds:
      - |
        # Defined once, used at all three check sites below.
        {{if eq OS "windows"}}
        port_listening() { powershell -NoProfile -NonInteractive -Command "if (Get-NetTCPConnection -LocalPort {{.INGRESS_PORT}} -State Listen -ErrorAction SilentlyContinue) { exit 0 } else { exit 1 }"; }
        {{else}}
        port_listening() { lsof -nP -iTCP:{{.INGRESS_PORT}} -sTCP:LISTEN >/dev/null 2>&1; }
        {{end}}

        # Use the server container as the source of truth.  k3d's JSON list
        # command can return "No nodes found" on Docker Desktop after a
        # daemon/WSL restart even though stale cluster metadata remains.
        server="k3d-{{.CLUSTER_NAME}}-server-0"
        server_exists="$(docker ps -aq --filter "name=^/${server}$")"
        server_running="$(docker ps -q --filter "name=^/${server}$")"
        running="0"
        if [ -n "$server_running" ]; then
            running="1"
        fi
        # Docker/k3d doesn't reliably surface a port-bind conflict on its own
        # (observed silent failure via Rancher Desktop's Lima forwarder).
        if [ "$running" = "0" ] && port_listening; then
            echo "Error: host port {{.INGRESS_PORT}} is already in use by another process." >&2
            echo "Free port {{.INGRESS_PORT}} and re-run 'task start-k8s'." >&2
            exit 1
        fi
        if [ -z "$server_exists" ]; then
            # Remove stale k3d metadata/resources before recreating.  The
            # command is intentionally best-effort: k3d reports an error when
            # metadata exists but its node containers are gone.
            k3d cluster delete {{.CLUSTER_NAME}} >/dev/null 2>&1 || true
            echo "Creating cluster '{{.CLUSTER_NAME}}'..."
            mkdir -p .k3d
            k3d cluster create {{.CLUSTER_NAME}} \
                --servers 1 \
                --registry-create {{.REGISTRY_NAME}}:0.0.0.0:{{.REGISTRY_PORT}} \
                -p "{{.INGRESS_PORT}}:80@loadbalancer" \
                --kubeconfig-update-default=false \
                --kubeconfig-switch-context=false
            if [ -f "{{.CORP_CA_BUNDLE}}" ]; then
                echo "Trusting corporate CA bundle inside the cluster node ({{.CORP_CA_BUNDLE}})..."
                docker cp "{{.CORP_CA_BUNDLE}}" "k3d-{{.CLUSTER_NAME}}-server-0:/etc/ssl/certs/ca-certificates.crt"
                docker restart "k3d-{{.CLUSTER_NAME}}-server-0" >/dev/null
                sleep 5
            else
                echo "Note: corporate CA bundle not found at {{.CORP_CA_BUNDLE}} — external image pulls from inside the cluster may fail on networks with TLS inspection. Cluster creation proceeds unaffected either way." >&2
            fi
        elif [ "$running" = "0" ]; then
            echo "Resuming cluster '{{.CLUSTER_NAME}}'..."
            k3d cluster start {{.CLUSTER_NAME}}
        else
            echo "Cluster '{{.CLUSTER_NAME}}' is already running."
        fi
        mkdir -p .k3d
        # Rewrite host.docker.internal to 127.0.0.1: the Windows firewall can
        # block connections to the mapped API port via the host's LAN IP,
        # while loopback always works (Docker publishes the port on 0.0.0.0).
        k3d kubeconfig get {{.CLUSTER_NAME}} | sed 's/host\.docker\.internal/127.0.0.1/g' > {{.KUBECONFIG_PATH}}
        echo "Waiting for ingress port {{.INGRESS_PORT}} to come up..."
        i=0
        while [ "$i" -lt 30 ] && ! port_listening; do
            sleep 1
            i=$((i + 1))
        done
        if ! port_listening; then
            echo "Warning: port {{.INGRESS_PORT}} did not come up within 30s. Ingress may not be reachable yet — check 'docker ps' and try again shortly." >&2
        fi
        echo "Ready. Registry (push, from host): localhost:{{.REGISTRY_PORT}}"
        echo "      Registry (pull, in pod specs): {{.REGISTRY_NAME}}:{{.REGISTRY_PORT}}"
        echo "      Ingress: http://localhost:{{.INGRESS_PORT}}"

  stop-k8s:
    desc: Pause the cluster (state and registry contents preserved).
    cmds:
      - |
        info="$(k3d cluster list {{.CLUSTER_NAME}} -o json 2>/dev/null || echo '[]')"
        if [ "$(echo "$info" | jq 'length')" = "0" ]; then
            echo "No cluster named '{{.CLUSTER_NAME}}' exists."
            exit 0
        fi
        running="$(echo "$info" | jq '.[0].serversRunning')"
        if [ "$running" = "0" ]; then
            echo "Cluster '{{.CLUSTER_NAME}}' is already stopped."
        else
            k3d cluster stop {{.CLUSTER_NAME}}
        fi

  delete-k8s:
    desc: Delete the cluster, registry, and local kubeconfig.
    cmds:
      - |
        # Always make deletion idempotent.  On Docker Desktop, k3d can leave
        # cluster metadata in a state where `cluster list -o json` fails with
        # "No nodes found"; using that command as a precondition prevents the
        # cleanup command from doing anything.
        k3d cluster delete {{.CLUSTER_NAME}} || true
        rm -f {{.KUBECONFIG_PATH}}

  run-k8s:
    desc: 'Run kubectl against this project''s cluster only. Usage: task run-k8s -- get pods'
    cmds:
      - task: _require-cluster
      - '{{.KUBECTL}} {{.CLI_ARGS}}'

  # ── Image builds ───────────────────────────────────────────────────────────

  # Corporate network: copies CORP_CA_BUNDLE into .docker/corp-ca/ (gitignored)
  # so the Dockerfile's bind mount can trust it inside the Alpine build stage.
  _build-image:
    internal: true
    requires:
      vars: [APP]
    cmds:
      - |
        corp_ca_dst="{{.APP}}/.docker/corp-ca/_corp-ca.pem"
        if [ -f "{{.CORP_CA_BUNDLE}}" ]; then
            cp "{{.CORP_CA_BUNDLE}}" "$corp_ca_dst"
            trap "rm -f $corp_ca_dst" EXIT
        fi
        docker build --build-context shared=./shared -t localhost:{{.REGISTRY_PORT}}/{{.APP}}:dev {{.APP}}/
        docker push localhost:{{.REGISTRY_PORT}}/{{.APP}}:dev
        echo "Image ready: localhost:{{.REGISTRY_PORT}}/{{.APP}}:dev"

  # Queries the registry manifest API directly rather than a local `docker
  # images` (the image was pushed, may not be present locally under this tag).
  _check-image-size:
    internal: true
    requires:
      vars: [APP]
    cmds:
      - |
        accept="application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json"
        index=$(curl -sf -H "Accept: $accept" \
            "http://localhost:{{.REGISTRY_PORT}}/v2/{{.APP}}/manifests/dev")
        media_type=$(echo "$index" | jq -r '.mediaType // ""')
        # OCI index / manifest list (modern Docker/Rancher Desktop): resolve the
        # platform-specific manifest before summing sizes.
        if echo "$media_type" | grep -q "index\|list"; then
            digest=$(echo "$index" | jq -r --arg arch "{{ARCH}}" '
                [.manifests[] | select(.platform.os != "unknown" and .platform.architecture != "unknown")]
                | map(select(.platform.architecture == $arch)) | first | .digest // empty')
            if [ -z "$digest" ]; then
                echo "Warning: no manifest found for architecture {{ARCH}}; falling back to first non-unknown manifest." >&2
                digest=$(echo "$index" | jq -r '
                    [.manifests[] | select(.platform.os != "unknown" and .platform.architecture != "unknown")]
                    | first | .digest')
            fi
            manifest=$(curl -sf \
                -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
                "http://localhost:{{.REGISTRY_PORT}}/v2/{{.APP}}/manifests/${digest}")
        else
            manifest="$index"
        fi
        size=$(echo "$manifest" | jq '(.config.size // 0) + ([.layers[].size] | add // 0)')
        threshold=52428800
        # Integer-only MB display — avoids a `bc` dependency (no native Windows equivalent).
        size_mb_whole=$((size / 1048576))
        size_mb_frac=$(( (size * 100 / 1048576) % 100 ))
        printf "Compressed {{.APP}} image size: %s bytes (%d.%02d MB)\n" "$size" "$size_mb_whole" "$size_mb_frac"
        if [ "$size" -gt "$threshold" ]; then
            echo "FAIL: {{.APP}} image exceeds the 50 MB threshold (${threshold} bytes)" >&2
            exit 1
        fi
        echo "PASS: {{.APP}} image is within the 50 MB threshold."

  # ── Shared internal steps ────────────────────────────────────────────────────

  # .k3d/kubeconfig can exist while the cluster is stopped, so a file check
  # alone isn't enough — confirm via k3d that a server is actually running.
  _require-cluster:
    internal: true
    preconditions:
      - sh: |
          running=$(k3d cluster list {{.CLUSTER_NAME}} -o json 2>/dev/null | jq 'if length == 0 then 0 else .[0].serversRunning end')
          [ "$running" != "0" ]
        msg: "Cluster is not running. Run 'task start-k8s' first."

  _apply-namespaces:
    internal: true
    cmds:
      - '{{.KUBECTL}} apply -f k8s/00-namespaces.yaml'

  # Generates .k3d/postgres.env once — the status check skips regeneration
  # once a real (non-empty) password is present. Never rotates after first
  # use, since that would lock the already-initialized Postgres data dir out.
  # On Windows a previous failed run can leave an empty placeholder file,
  # which the status check also treats as "needs (re)generating".
  _generate-postgres-env:
    internal: true
    vars:
      ENV_FILE: .k3d/postgres.env
    status:
      - grep -q '^POSTGRES_PASSWORD=..*' {{.ENV_FILE}}
    cmds:
      - mkdir -p .k3d
      - echo "Generating Postgres credentials into {{.ENV_FILE}}..."
      - |
        {
            echo "POSTGRES_USER=postgres"
            echo "POSTGRES_DB=postgres"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
        } > {{.ENV_FILE}}
      - echo "Credentials written (gitignored). Do not rotate after first Postgres start."

  # Projects .k3d/postgres.env as a Secret into both namespaces — always runs
  # (kubectl apply is itself idempotent), unlike the credential generation above.
  _ensure-db-secret:
    internal: true
    cmds:
      - task: _generate-postgres-env
      - for: [data, app]
        cmd: |
          echo "Projecting postgres-credentials Secret into namespace {{.ITEM}}..."
          {{.KUBECTL}} create secret generic postgres-credentials \
              --from-env-file=.k3d/postgres.env \
              --namespace={{.ITEM}} \
              --dry-run=client -o yaml \
          | {{.KUBECTL}} apply -f -

  # Same pattern as _generate-garage-toml, for pgAdmin's servers.json instead
  # of Garage's config file: substitutes the real Postgres superuser/db (from
  # .k3d/postgres.env) into k8s/pgadmin/servers.json.tmpl, then projects the
  # rendered file as the pgadmin-config ConfigMap. Always runs — servers.json
  # holds no secrets, so no need for the once-only guard _generate-postgres-env
  # uses; kubectl apply is itself idempotent.
  _ensure-pgadmin-config:
    internal: true
    vars:
      ENV_FILE: .k3d/postgres.env
      RENDERED_FILE: .k3d/pgadmin-servers.json
    cmds:
      - task: _generate-postgres-env
      - |
        . {{.ENV_FILE}}
        sed \
            -e "s/__POSTGRES_USER__/${POSTGRES_USER}/" \
            -e "s/__POSTGRES_DB__/${POSTGRES_DB}/" \
            k8s/pgadmin/servers.json.tmpl > {{.RENDERED_FILE}}
        echo "Projecting pgadmin-config ConfigMap into namespace data..."
        {{.KUBECTL}} create configmap pgadmin-config \
            --from-file=servers.json={{.RENDERED_FILE}} \
            --namespace=data \
            --dry-run=client -o yaml \
        | {{.KUBECTL}} apply -f -

  # Projects the Postgres password (from .k3d/postgres.env) into a .pgpass-
  # format Secret pgAdmin's servers.json PassFile points at, so its
  # preconfigured server connects with no password prompt. Always runs
  # (kubectl apply is itself idempotent), same reasoning as _ensure-db-secret.
  _ensure-pgadmin-pgpass:
    internal: true
    vars:
      ENV_FILE: .k3d/postgres.env
    cmds:
      - task: _generate-postgres-env
      - |
        . {{.ENV_FILE}}
        echo "Projecting pgadmin-pgpass Secret into namespace data..."
        {{.KUBECTL}} create secret generic pgadmin-pgpass \
            --from-literal=pgpass="postgres.data.svc.cluster.local:5432:*:${POSTGRES_USER}:${POSTGRES_PASSWORD}" \
            --namespace=data \
            --dry-run=client -o yaml \
        | {{.KUBECTL}} apply -f -

  # Same pattern as _generate-postgres-env, for Garage's config file instead of
  # a flat env file: substitutes fresh secrets into k8s/garage/garage.toml.tmpl.
  _generate-garage-toml:
    internal: true
    vars:
      CFG_FILE: .k3d/garage.toml
    status:
      - grep -Eq '^rpc_secret = "[0-9a-fA-F]{64}"$' {{.CFG_FILE}}
      - grep -Eq '^admin_token = ".+"$' {{.CFG_FILE}}
      - grep -Eq '^metrics_token = ".+"$' {{.CFG_FILE}}
    cmds:
      - mkdir -p .k3d
      - echo "Generating Garage config into {{.CFG_FILE}}..."
      - |
        sed \
            -e "s/__RPC_SECRET__/$(openssl rand -hex 32)/" \
            -e "s|__ADMIN_TOKEN__|$(openssl rand -base64 32)|" \
            -e "s|__METRICS_TOKEN__|$(openssl rand -base64 32)|" \
            k8s/garage/garage.toml.tmpl > {{.CFG_FILE}}
      - echo "Config written (gitignored). Do not rotate after first Garage start."

  # Projects .k3d/garage.toml as a Secret into namespace data — always runs,
  # same reasoning as _ensure-db-secret above.
  _ensure-garage-config:
    internal: true
    cmds:
      - task: _generate-garage-toml
      - echo "Projecting garage-config Secret into namespace data..."
      - |
        {{.KUBECTL}} create secret generic garage-config \
            --from-file=garage.toml=.k3d/garage.toml \
            --namespace=data \
            --dry-run=client -o yaml \
        | {{.KUBECTL}} apply -f -

  # ── Shared infrastructure ────────────────────────────────────────────────────
  #
  # Split so you can deploy only the pieces you're currently working with,
  # rather than everything at once. Each pair applies/deletes its own
  # manifest(s) only — safe to run in any combination.

  deploy-postgres:
    desc: Deploy Postgres and pgAdmin to the running cluster.
    cmds:
      - task: _require-cluster
      - task: _apply-namespaces
      - task: _ensure-db-secret
      - task: _ensure-pgadmin-config
      - task: _ensure-pgadmin-pgpass
      - '{{.KUBECTL}} rollout status deployment/local-path-provisioner -n kube-system --timeout=120s'
      - '{{.KUBECTL}} apply -f k8s/10-postgres.yaml -f k8s/30-pgadmin.yaml'
      - '{{.KUBECTL}} set image deployment/postgres postgres={{.POSTGRES_IMAGE}} -n data'
      - '{{.KUBECTL}} set image deployment/pgadmin pgadmin={{.PGADMIN_IMAGE}} -n data'
      - '{{.KUBECTL}} delete pod -n data -l app=postgres --ignore-not-found'
      - '{{.KUBECTL}} delete pod -n data -l app=pgadmin --ignore-not-found'
      - '{{.KUBECTL}} wait --for=jsonpath=''{.status.phase}''=Bound pvc/postgres-data -n data --timeout=180s'
      - '{{.KUBECTL}} rollout status deployment/postgres -n data --timeout=180s'
      - '{{.KUBECTL}} rollout status deployment/pgadmin  -n data --timeout=180s'
      - echo "postgres ready."
      - 'echo "pgadmin ready: http://pgadmin.localhost:{{.INGRESS_PORT}}"'
      - 'echo "  login: admin@k8s-lab.local / admin"'

  delete-postgres:
    desc: Delete Postgres and pgAdmin from the running cluster.
    cmds:
      - task: _require-cluster
      - '{{.KUBECTL}} delete -f k8s/30-pgadmin.yaml -f k8s/10-postgres.yaml --ignore-not-found'

  deploy-qdrant:
    desc: Deploy Qdrant to the running cluster.
    cmds:
      - task: _require-cluster
      - task: _apply-namespaces
      - '{{.KUBECTL}} rollout status deployment/local-path-provisioner -n kube-system --timeout=120s'
      - '{{.KUBECTL}} apply -f k8s/20-qdrant.yaml'
      - '{{.KUBECTL}} set image deployment/qdrant qdrant={{.QDRANT_IMAGE}} -n data'
      - '{{.KUBECTL}} delete pod -n data -l app=qdrant --ignore-not-found'
      - '{{.KUBECTL}} wait --for=jsonpath=''{.status.phase}''=Bound pvc/qdrant-data -n data --timeout=180s'
      - '{{.KUBECTL}} rollout status deployment/qdrant -n data --timeout=180s'
      - echo "qdrant ready."

  delete-qdrant:
    desc: Delete Qdrant from the running cluster.
    cmds:
      - task: _require-cluster
      - '{{.KUBECTL}} delete -f k8s/20-qdrant.yaml --ignore-not-found'

  deploy-nats:
    desc: Deploy NATS to the running cluster.
    cmds:
      - task: _require-cluster
      - task: _apply-namespaces
      - '{{.KUBECTL}} apply -f k8s/35-nats.yaml'
      - '{{.KUBECTL}} set image deployment/nats nats={{.NATS_IMAGE}} -n data'
      - '{{.KUBECTL}} delete pod -n data -l app=nats --ignore-not-found'
      - '{{.KUBECTL}} rollout status deployment/nats -n data --timeout=180s'
      - 'echo "nats ready: http://nats.localhost:{{.INGRESS_PORT}}"'

  delete-nats:
    desc: Delete NATS from the running cluster.
    cmds:
      - task: _require-cluster
      - '{{.KUBECTL}} delete -f k8s/35-nats.yaml --ignore-not-found'

  deploy-garage:
    desc: Deploy Garage to the running cluster and bootstrap its layout, dev bucket, and access key.
    cmds:
      - task: _require-cluster
      - task: _apply-namespaces
      - task: _ensure-garage-config
      - '{{.KUBECTL}} rollout status deployment/local-path-provisioner -n kube-system --timeout=120s'
      - '{{.KUBECTL}} apply -f k8s/25-garage.yaml'
      - '{{.KUBECTL}} set image deployment/garage garage={{.GARAGE_IMAGE}} -n data'
      - '{{.KUBECTL}} delete pod -n data -l app=garage --ignore-not-found'
      # Not "rollout status" here: Garage's /health returns 503 — failing the
      # readiness probe — until a cluster layout is assigned, which is what
      # _init-garage below does. Wait for the container to be Running instead;
      # `kubectl exec` works against a Running-but-not-Ready pod.
      - '{{.KUBECTL}} wait --for=jsonpath=''{.status.phase}''=Running -n data -l app=garage pod --timeout=120s'
      - task: _init-garage
      - '{{.KUBECTL}} rollout status deployment/garage -n data --timeout=60s'
      - 'echo "garage (S3):    http://garage.localhost:{{.INGRESS_PORT}}"'
      - 'echo "garage (admin): http://garage-admin.localhost:{{.INGRESS_PORT}}"'

  delete-garage:
    desc: Delete Garage from the running cluster.
    cmds:
      - task: _require-cluster
      - '{{.KUBECTL}} delete -f k8s/25-garage.yaml --ignore-not-found'

  deploy-ollama:
    desc: Deploy the Ollama proxy Service to the running cluster (points at host.docker.internal:11434 — nothing runs in-cluster).
    cmds:
      - task: _require-cluster
      - task: _apply-namespaces
      - '{{.KUBECTL}} apply -f k8s/26-ollama.yaml'
      - 'echo "ollama proxy ready: ollama.data.svc.cluster.local:11434 -> host.docker.internal:11434"'

  delete-ollama:
    desc: Delete the Ollama proxy Service from the running cluster.
    cmds:
      - task: _require-cluster
      - '{{.KUBECTL}} delete -f k8s/26-ollama.yaml --ignore-not-found'

  llm-status:
    desc: Show which LLM sources (LAN Ollama, OpenRouter, Vertex AI, local Ollama) are available, in priority order; fails if none (read-only, reads LLM_* variables from the shell).
    cmds:
      - bash scripts/llm-status.sh

  test-llm-scripts:
    desc: Test the llm-* task scripts against a fake Ollama and a fake gcloud (no real LLM).
    cmds:
      - bash scripts/llm-status_test.sh
      - bash scripts/llm-generate_test.sh

  # ── Extra LLM sources (LAN Ollama, OpenRouter, Vertex AI) ───────────────────
  # The settings come from .env only (see .env.example and scripts/llm-env.sh); the
  # shell's own variables of those names are ignored. The generated models
  # files and the list of enabled sources live in .k3d/llm/ (no secrets); the
  # deploy tasks use the generated files while they exist.
  llm-enable:
    desc: Add the available extra LLM sources (LAN Ollama, OpenRouter, Vertex AI) to the assistant, phraseforge and knowledge in the dev cluster; fails if no source is available.
    cmds:
      - task: _require-cluster
      - task: _llm-guard
      - task: _llm-guard-vertex
      - bash scripts/llm-enable.sh
      - task: _llm-apply

  llm-disable:
    desc: Remove the extra LLM sources, their keys and tokens from the dev cluster; the apps return to the committed local Ollama configuration.
    cmds:
      - task: _require-cluster
      - rm -rf .k3d/llm
      - task: _llm-apply

  # Refuses to take over an OPENROUTER_API_KEY that someone put into
  # assistant-llm-keys or phraseforge-llm-keys by hand (both READMEs tell you to
  # create those Secrets yourself); only a key this task added (marked by an
  # annotation) is replaced or removed.
  _llm-guard:
    internal: true
    cmds:
      - |
        eval "$(bash scripts/llm-env.sh --export)"
        if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            for app in {{.LLM_APPS}}; do
                name="$app-llm-keys"
                if {{.KUBECTL}} get secret "$name" -n app -o json 2>/dev/null \
                    | jq -e '(.data.OPENROUTER_API_KEY != null) and ((.metadata.annotations["llm.k8s-lab/managed-keys"] // "") != "OPENROUTER_API_KEY")' >/dev/null; then
                    echo "Secret $name already has an OPENROUTER_API_KEY that llm-enable did not add; refusing to overwrite it. Remove that key from the Secret, or unset OPENROUTER_API_KEY here to use it as is." >&2
                    exit 1
                fi
            done
        fi

  # Same rule for the Vertex token Secrets: one this task did not create is never
  # overwritten.
  _llm-guard-vertex:
    internal: true
    cmds:
      - |
        eval "$(bash scripts/llm-env.sh --export)"
        if [ -n "${LLM_VERTEX_ACCOUNT:-}" ]; then
            for app in {{.LLM_APPS}}; do
                name="$app-vertex"
                if {{.KUBECTL}} get secret "$name" -n app -o json 2>/dev/null \
                    | jq -e '(.metadata.annotations["llm.k8s-lab/managed"] // "") != "true"' >/dev/null; then
                    echo "Secret $name already exists and llm-enable did not create it; refusing to overwrite it. Delete it with: kubectl --kubeconfig=.k3d/kubeconfig -n app delete secret $name   (or remove LLM_VERTEX_ACCOUNT from .env)" >&2
                    exit 1
                fi
            done
        fi

  _llm-apply:
    internal: true
    cmds:
      - task: _apply-namespaces
      - task: _llm-openrouter-key
      - task: _llm-vertex-token
      - task: _ensure-assistant-models
      - task: _ensure-phraseforge-models
      - task: _ensure-knowledge-models
      - task: _llm-restart

  _llm-openrouter-key:
    internal: true
    cmds:
      - |
        eval "$(bash scripts/llm-env.sh --export)"
        sources=""
        if [ -f .k3d/llm/sources ]; then sources="$(cat .k3d/llm/sources)"; fi
        if printf '%s\n' "$sources" | grep -qx openrouter; then
            for app in {{.LLM_APPS}}; do
                name="$app-llm-keys"
                # apply merges: other keys already in the Secret stay.
                printf '%s' "$OPENROUTER_API_KEY" \
                | {{.KUBECTL}} create secret generic "$name" --from-file=OPENROUTER_API_KEY=/dev/stdin \
                    --namespace=app --dry-run=client -o yaml \
                | {{.KUBECTL}} apply -f - >/dev/null
                {{.KUBECTL}} annotate secret "$name" -n app --overwrite llm.k8s-lab/managed-keys=OPENROUTER_API_KEY >/dev/null
            done
            echo "OpenRouter key stored in the Secrets <app>-llm-keys for: {{.LLM_APPS}}"
        else
            # Only a key this task added is removed; the Secret goes only when empty.
            for app in {{.LLM_APPS}}; do
                name="$app-llm-keys"
                if {{.KUBECTL}} get secret "$name" -n app >/dev/null 2>&1; then
                    managed="$({{.KUBECTL}} get secret "$name" -n app -o json | jq -r '.metadata.annotations["llm.k8s-lab/managed-keys"] // ""')"
                    if [ "$managed" = OPENROUTER_API_KEY ]; then
                        {{.KUBECTL}} patch secret "$name" -n app --type=json \
                            -p '[{"op":"remove","path":"/data/OPENROUTER_API_KEY"}]' >/dev/null 2>&1 || true
                        {{.KUBECTL}} annotate secret "$name" -n app llm.k8s-lab/managed-keys- >/dev/null
                        left="$({{.KUBECTL}} get secret "$name" -n app -o json | jq '(.data // {}) | length')"
                        if [ "$left" = 0 ]; then {{.KUBECTL}} delete secret "$name" -n app; fi
                    fi
                fi
            done
        fi

  # A short-lived (about an hour) OAuth token of the gcloud account in
  # LLM_VERTEX_ACCOUNT, one Secret per app; the pods re-read the file on every
  # call, so a refreshed token needs no restart.
  _llm-vertex-token:
    internal: true
    cmds:
      - |
        set -e
        eval "$(bash scripts/llm-env.sh --export)"
        sources=""
        if [ -f .k3d/llm/sources ]; then sources="$(cat .k3d/llm/sources)"; fi
        if printf '%s\n' "$sources" | grep -qx vertex; then
            token="$(timeout 20 gcloud auth print-access-token --account="$LLM_VERTEX_ACCOUNT")"
            for app in {{.LLM_APPS}}; do
                name="$app-vertex"
                printf '%s' "$token" \
                | {{.KUBECTL}} create secret generic "$name" --from-file=token=/dev/stdin \
                    --namespace=app --dry-run=client -o yaml \
                | {{.KUBECTL}} apply -f - >/dev/null
                {{.KUBECTL}} annotate secret "$name" -n app --overwrite llm.k8s-lab/managed=true >/dev/null
            done
            echo "Vertex token stored in the Secrets <app>-vertex for: {{.LLM_APPS}} (valid about an hour)"
        else
            # Only Secrets this task wrote (marked by the annotation) are removed.
            for app in {{.LLM_APPS}}; do
                name="$app-vertex"
                marked="$({{.KUBECTL}} get secret "$name" -n app -o json 2>/dev/null | jq -r '.metadata.annotations["llm.k8s-lab/managed"] // ""' || true)"
                if [ "$marked" = true ]; then {{.KUBECTL}} delete secret "$name" -n app; fi
            done
        fi

  # Applies the manifests (they gained an optional key env and Vertex volume) and
  # makes the apps that are deployed re-read their configuration, but only when it
  # changed: each Deployment's pod template carries an annotation with the
  # resource versions of its models ConfigMap and its key Secret (never their
  # content), and Kubernetes rolls the pods out only when that value changes. A
  # Vertex token needs no restart (the file is re-read on every call). Apps that
  # are not deployed pick this up at their deploy.
  _llm-restart:
    internal: true
    cmds:
      - |
        for app in {{.LLM_APPS}}; do
            if {{.KUBECTL}} get deployment/"$app" -n app >/dev/null 2>&1; then
                {{.KUBECTL}} apply -f "$app/k8s/"
                models="$({{.KUBECTL}} get configmap "$app-models" -n app -o jsonpath='{.metadata.resourceVersion}')"
                keys="$({{.KUBECTL}} get secret "$app-llm-keys" -n app -o jsonpath='{.metadata.resourceVersion}' 2>/dev/null || true)"
                {{.KUBECTL}} patch deployment/"$app" -n app --type=merge \
                    -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"llm.k8s-lab/config\":\"models=${models};keys=${keys:-none}\"}}}}}"
                {{.KUBECTL}} rollout status deployment/"$app" -n app --timeout=120s
            else
                echo "$app is not deployed; it uses this configuration from its next deploy"
            fi
        done

  deploy-headlamp:
    desc: Deploy Headlamp Kubernetes dashboard to the running cluster.
    cmds:
      - task: _require-cluster
      - '{{.KUBECTL}} rollout status deployment/coredns -n kube-system --timeout=120s'
      - '{{.KUBECTL}} rollout status deployment/traefik -n kube-system --timeout=180s'
      - '{{.KUBECTL}} wait --for=condition=Ready pod -n kube-system -l svccontroller.k3s.cattle.io/svcname=traefik --timeout=120s'
      - '{{.KUBECTL}} apply -f k8s/50-headlamp.yaml'
      - '{{.KUBECTL}} set image deployment/headlamp headlamp={{.HEADLAMP_IMAGE}} -n kube-system'
      - '{{.KUBECTL}} rollout restart deployment/headlamp -n kube-system'
      - '{{.KUBECTL}} rollout status deployment/headlamp -n kube-system --timeout=180s'
      - |
        i=0
        while [ "$i" -lt 30 ]; do
            token="$({{.KUBECTL}} get secret headlamp-admin -n kube-system -o json | jq -r '.data.token // empty')"
            if [ -n "$token" ]; then
                break
            fi
            sleep 1
            i=$((i + 1))
        done
        if [ -z "$token" ]; then
            echo "Warning: Headlamp admin token was not populated yet. Re-run 'task deploy-headlamp' or inspect secret/headlamp-admin in kube-system." >&2
        else
            echo "Headlamp admin token:"
            printf '%s' "$token" | base64 -d
            echo
        fi
      - 'echo "headlamp ready: http://headlamp.localhost:{{.INGRESS_PORT}}"'

  delete-headlamp:
    desc: Delete Headlamp Kubernetes dashboard from the running cluster.
    cmds:
      - task: _require-cluster
      - '{{.KUBECTL}} delete -f k8s/50-headlamp.yaml --ignore-not-found'

  # ── dictionary ───────────────────────────────────────────────────────────────

  deploy-dictionary:
    desc: Build and deploy the dictionary service to the running cluster.
    cmds:
      - task: _build-image
        vars:
          APP: dictionary
      - task: _check-image-size
        vars:
          APP: dictionary
      - task: _require-cluster
      - task: _apply-namespaces
      - task: _ensure-db-secret
      - task: _migrate-db
        vars:
          APP: dictionary
          JOB_NAME: dictionary-migrate
      - '{{.KUBECTL}} apply -f dictionary/k8s/'
      - '{{.KUBECTL}} rollout status deployment/dictionary -n app --timeout=120s'
      - 'echo "dictionary ready: http://dictionary.localhost:{{.INGRESS_PORT}}"'

  delete-dictionary:
    desc: Delete the dictionary service from the running cluster.
    cmds:
      - task: _require-cluster
      - '{{.KUBECTL}} delete -f dictionary/k8s/ --ignore-not-found'

  migrate-dictionary-db:
    desc: Run the dictionary database migration Job against the running cluster.
    cmds:
      - task: _migrate-db
        vars:
          APP: dictionary
          JOB_NAME: dictionary-migrate

  # ── knowledge ────────────────────────────────────────────────────────────────

  deploy-knowledge:
    desc: Build and deploy the knowledge app to the running cluster.
    cmds:
      - task: _build-image
        vars:
          APP: knowledge
      - task: _check-image-size
        vars:
          APP: knowledge
      - task: deploy-qdrant
      - task: _apply-namespaces
      - task: _ensure-db-secret
      - '{{.KUBECTL}} apply -f knowledge/k8s/configmap.yaml'
      - task: _ensure-knowledge-models
      - task: _migrate-db
        vars:
          APP: knowledge
          JOB_NAME: knowledge-migrate
      - '{{.KUBECTL}} apply -f knowledge/k8s/deployment.yaml'
      - '{{.KUBECTL}} rollout restart deployment/knowledge -n app'
      - '{{.KUBECTL}} rollout status deployment/knowledge -n app --timeout=120s'
      - 'echo "knowledge ready: http://knowledge.localhost:{{.INGRESS_PORT}}"'

  delete-knowledge:
    desc: Delete the knowledge app from the running cluster.
    cmds:
      - task: _require-cluster
      - '{{.KUBECTL}} delete -f knowledge/k8s/deployment.yaml --ignore-not-found'
      - '{{.KUBECTL}} delete -f knowledge/k8s/configmap.yaml --ignore-not-found'
      - '{{.KUBECTL}} delete configmap knowledge-models -n app --ignore-not-found'

  # The models file is a ConfigMap built from knowledge/models.dev.yaml, or from
  # the file `task llm-enable` generated, checked first (knowledge shares the
  # assistant's models schema) so a mistake in it stops the deploy instead of the
  # pod. The migrate Job and the Deployment both mount it, so it is applied
  # before either.
  _ensure-knowledge-models:
    internal: true
    cmds:
      - |
        file="$PWD/knowledge/models.dev.yaml"
        if [ -f .k3d/llm/knowledge-models.yaml ]; then file="$PWD/.k3d/llm/knowledge-models.yaml"; fi
        (cd assistant && go run . models validate "$file")
        {{.KUBECTL}} create configmap knowledge-models \
            --from-file=models.yaml="$file" \
            --namespace=app \
            --dry-run=client -o yaml \
        | {{.KUBECTL}} apply -f -

  migrate-knowledge-db:
    desc: Ensure the knowledge Qdrant collection exists.
    cmds:
      - task: _migrate-db
        vars:
          APP: knowledge
          JOB_NAME: knowledge-migrate

  test-knowledge-frontend:
    desc: Run knowledge's kb-* Web Component tests (Node+jsdom, dev-time only).
    dir: knowledge/internal/server/static/components
    cmds:
      - npm install
      - npm test

  # ── ci ───────────────────────────────────────────────────────────────────────

  check-ci:
    desc: Check the release workflows against the apps and ci-test.sh, and run the node tests of the CI scripts.
    cmds:
      - node scripts/check-ci.mjs
      - node --test scripts/stamp-changelog.test.mjs scripts/check-ci.test.mjs

  # Runs what CI runs (scripts/ci-test.sh) on a clean copy of the tree: tracked
  # and untracked files, minus gitignored ones, so a build output that exists
  # only on this machine (shared/ui/dist) cannot hide a CI failure. Needs no
  # cluster and no database: tests skip without their env vars, as in CI.
  # Usage: task ci-local, or task ci-local APP=dictionary for one app.
  ci-local:
    desc: Run CI's tests (scripts/ci-test.sh) on a clean copy of the tree, for all apps or one (APP=<app>).
    vars:
      CI_APPS: '{{if .APP}}{{.APP}}{{else}}assistant knowledge phraseforge dictionary{{end}}'
    cmds:
      - |
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        # A tracked file deleted in the working tree is still listed by git
        # ls-files; rsync copies the rest and exits 23, which is tolerated.
        # (macOS's openrsync has no --ignore-missing-args.)
        copy_status=0
        git ls-files -z -co --exclude-standard | rsync -a0 --files-from=- ./ "$tmp/" || copy_status=$?
        if [ "$copy_status" -ne 0 ] && [ "$copy_status" -ne 23 ]; then
            echo "copying the clean tree failed (rsync exit $copy_status)" >&2
            exit "$copy_status"
        fi
        failed=0
        for app in {{.CI_APPS}}; do
            log="$tmp/ci-$app.log"
            if (cd "$tmp" && bash scripts/ci-test.sh "$app") >"$log" 2>&1; then
                echo "ok    $app"
            else
                failed=1
                echo "FAIL  $app: $(grep '^+ ' "$log" | tail -n 1)"
                tail -n 30 "$log" | sed 's/^/        /'
            fi
        done
        exit "$failed"

  # ── shared ui ────────────────────────────────────────────────────────────────

  build-ui:
    desc: Bundle shared/ui's TypeScript components into shared/ui/dist (not committed; apps embed it).
    dir: shared/ui
    cmds:
      - npm ci
      - npm run build

  test-ui:
    desc: Type-check and test shared/ui (Node+jsdom run directly on the TypeScript source), then its Go handler.
    dir: shared/ui
    cmds:
      - npm ci
      - npm run typecheck
      - npm test
      - go test ./...

  # ── phraseforge ──────────────────────────────────────────────────────────────

  test-phraseforge-frontend:
    desc: Run phraseforge's pf-* Web Component tests (Node+jsdom, dev-time only).
    dir: phraseforge/internal/server/static/components
    cmds:
      - npm install
      - npm test

  # ── assistant ────────────────────────────────────────────────────────────────

  # Vets and tests the assistant. No test calls an LLM or needs the network. The
  # database tests need PostgreSQL: when the dev cluster's Postgres is up this
  # creates the assistant_test database, forwards its port and points
  # ASSISTANT_TEST_DATABASE_URL at it; otherwise they are skipped, loudly.
  test-assistant:
    desc: Vet and test the assistant (scripted fakes only; database tests use the dev cluster's Postgres when it is up).
    cmds:
      - |
        port="{{.ASSISTANT_TEST_DB_PORT}}"
        forward_pid=""
        # kubectl here is a kuberlr launcher that starts the real kubectl as a
        # child, so killing the launcher's pid leaves the forward running; the
        # forward is stopped by its command line, which names this port.
        cleanup() {
            if [ -n "$forward_pid" ]; then
                kill "$forward_pid" 2>/dev/null || true
                pkill -f "port-forward -n data svc/postgres $port:5432" 2>/dev/null || true
            fi
        }
        trap cleanup EXIT

        if {{.KUBECTL}} get deploy/postgres -n data >/dev/null 2>&1 && [ -f .k3d/postgres.env ]; then
            exists="$({{.KUBECTL}} exec -i -n data deploy/postgres -- sh -c 'psql -U "$POSTGRES_USER" -d postgres -At' <<'SQL'
        SELECT 1 FROM pg_database WHERE datname = 'assistant_test'
        SQL
        )"
            if [ -z "$exists" ]; then
                echo "Creating database assistant_test..."
                {{.KUBECTL}} exec -n data deploy/postgres -- sh -c 'psql -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE assistant_test"'
            fi
            {{.KUBECTL}} port-forward -n data svc/postgres "$port:5432" >/dev/null 2>&1 &
            forward_pid=$!
            i=0
            while [ "$i" -lt 30 ] && ! nc -z 127.0.0.1 "$port" 2>/dev/null; do sleep 1; i=$((i + 1)); done
            # The generated password is hex, so it needs no URL encoding.
            . .k3d/postgres.env
            export ASSISTANT_TEST_DATABASE_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${port}/assistant_test?sslmode=disable"
        else
            echo "Warning: the dev cluster's Postgres is not reachable; the database tests are skipped. Run 'task start-k8s' and 'task deploy-postgres'." >&2
        fi

        # Not `set -e`-aborted by a failing test: the port-forward must be
        # stopped either way, and the test's exit status still decides.
        status=0
        (cd assistant && go vet ./... && go test -count=1 -race ./...) || status=$?
        cleanup
        exit "$status"

  test-bus:
    desc: Vet and test shared/bus against the dev cluster's NATS (port-forwarded for the run, stopped after).
    cmds:
      - |
        port="{{.NATS_TEST_PORT}}"
        # The forward is identified by its own command line (this argument order);
        # kubectl here is a kuberlr launcher that starts the real kubectl as a
        # child, so killing the launcher's pid would leave the forward running.
        forward="--kubeconfig={{.KUBECONFIG_PATH}} port-forward -n data svc/jdp-data-nats $port:4222"
        listeners() { lsof -nP -iTCP:"$port" -sTCP:LISTEN | wc -l | tr -d ' '; }

        if [ "$(listeners)" != "0" ]; then
            echo "Error: local port $port is already in use; stop what listens there and run the task again." >&2
            exit 1
        fi
        if ! {{.KUBECTL}} get svc/jdp-data-nats -n data >/dev/null 2>&1; then
            echo "Error: the dev cluster's service data/jdp-data-nats is not reachable. Run 'task start-k8s' and 'task deploy-nats'." >&2
            exit 1
        fi

        forward_started=""
        cleanup() {
            if [ -n "$forward_started" ]; then
                pkill -f -- "$forward" 2>/dev/null || true
                i=0
                while [ "$i" -lt 10 ] && [ "$(listeners)" != "0" ]; do sleep 0.5; i=$((i + 1)); done
            fi
        }
        trap cleanup EXIT

        {{.KUBECTL}} port-forward -n data svc/jdp-data-nats "$port:4222" >/dev/null 2>&1 &
        forward_started=1
        i=0
        while [ "$i" -lt 30 ] && ! nc -z 127.0.0.1 "$port" 2>/dev/null; do sleep 1; i=$((i + 1)); done

        # Not `set -e`-aborted by a failing test: the port-forward must be
        # stopped either way, and the test's exit status still decides.
        status=0
        if nc -z 127.0.0.1 "$port" 2>/dev/null; then
            (cd shared && NATS_URL="nats://127.0.0.1:$port" go test -count=1 -v ./bus) || status=$?
        else
            echo "Error: the port-forward to data/jdp-data-nats did not open local port $port within 30 s." >&2
            status=1
        fi
        cleanup
        forward_started=""
        if [ "$(listeners)" != "0" ]; then
            echo "Error: local port $port is still in use after the port-forward was stopped." >&2
            status=1
        fi
        exit "$status"

  test-assistant-frontend:
    desc: Run the assistant's as-* Web Component tests (Node+jsdom, dev-time only).
    dir: assistant/internal/server/static/components
    cmds:
      - npm install
      - npm test

  deploy-assistant:
    desc: Build and deploy the assistant to the running cluster.
    cmds:
      - task: _build-image
        vars:
          APP: assistant
      - task: _check-image-size
        vars:
          APP: assistant
      - task: _require-cluster
      - task: _apply-namespaces
      - task: _ensure-assistant-secret
      - task: _ensure-assistant-models
      - task: _ensure-assistant-workflows
      - task: _ensure-database
        vars:
          DB: assistant
      - task: _migrate-db
        vars:
          APP: assistant
          JOB_NAME: assistant-migrate
      - '{{.KUBECTL}} apply -f assistant/k8s/'
      - '{{.KUBECTL}} rollout restart deployment/assistant -n app'
      - '{{.KUBECTL}} rollout status deployment/assistant -n app --timeout=120s'
      - 'echo "assistant ready: http://assistant.localhost:{{.INGRESS_PORT}}/"'

  delete-assistant:
    desc: Delete the assistant from the running cluster (its database is kept).
    cmds:
      - task: _require-cluster
      - '{{.KUBECTL}} delete -f assistant/k8s/ --ignore-not-found'

  migrate-assistant-db:
    desc: Run the assistant's database migration Job against the running cluster.
    cmds:
      - task: _ensure-database
        vars:
          DB: assistant
      - task: _migrate-db
        vars:
          APP: assistant
          JOB_NAME: assistant-migrate

  # Creates a database in the dev cluster's Postgres if it is missing.
  _ensure-database:
    internal: true
    requires:
      vars: [DB]
    cmds:
      - task: _require-cluster
      - |
        exists="$({{.KUBECTL}} exec -i -n data deploy/postgres -- sh -c 'psql -U "$POSTGRES_USER" -d postgres -At' <<'SQL'
        SELECT 1 FROM pg_database WHERE datname = '{{.DB}}'
        SQL
        )"
        if [ -z "$exists" ]; then
            echo "Creating database {{.DB}}..."
            {{.KUBECTL}} exec -n data deploy/postgres -- sh -c 'psql -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE {{.DB}}"'
        fi

  # The assistant reads one variable, ASSISTANT_DATABASE_URL. Built from the
  # generated Postgres credentials into a gitignored file, then projected as a
  # Secret, like the other apps' credentials.
  _ensure-assistant-secret:
    internal: true
    cmds:
      - task: _ensure-db-secret
      - |
        . .k3d/postgres.env
        # The generated password is hex, so it needs no URL encoding.
        printf 'ASSISTANT_DATABASE_URL=postgres://%s:%s@postgres.data.svc.cluster.local:5432/assistant?sslmode=disable\n' "$POSTGRES_USER" "$POSTGRES_PASSWORD" > .k3d/assistant.env
        chmod 600 .k3d/assistant.env
        {{.KUBECTL}} create secret generic assistant-database \
            --from-env-file=.k3d/assistant.env \
            --namespace=app \
            --dry-run=client -o yaml \
        | {{.KUBECTL}} apply -f -

  # The models file is a ConfigMap built from assistant/models.dev.yaml, or from
  # the file `task llm-enable` generated (.k3d/llm/), checked first so a mistake
  # in it stops the deploy instead of the pod.
  _ensure-assistant-models:
    internal: true
    cmds:
      - |
        file="$PWD/assistant/models.dev.yaml"
        if [ -f .k3d/llm/assistant-models.yaml ]; then file="$PWD/.k3d/llm/assistant-models.yaml"; fi
        (cd assistant && go run . models validate "$file")
        {{.KUBECTL}} create configmap assistant-models \
            --from-file=models.yaml="$file" \
            --namespace=app \
            --dry-run=client -o yaml \
        | {{.KUBECTL}} apply -f -

  # The workflow files are a ConfigMap with one key per assistant/workflows/*.yaml,
  # checked first with the stub tools' names so a broken workflow stops the deploy.
  _ensure-assistant-workflows:
    internal: true
    cmds:
      - (cd assistant && go run . workflow validate --tools memory_search,memory_add,rag_search,web_search workflows/*.yaml)
      - |
        {{.KUBECTL}} create configmap assistant-workflows \
            --from-file=assistant/workflows \
            --namespace=app \
            --dry-run=client -o yaml \
        | {{.KUBECTL}} apply -f -

  # Vertex access tokens last about an hour: run this again when a call fails with
  # "401 ... token may have expired". The pods re-read the file, so no restart.
  llm-refresh-vertex-token:
    desc: Write a fresh Vertex AI access token (valid about an hour) into the Secrets of the assistant, phraseforge and knowledge; Vertex must be enabled by `task llm-enable`.
    cmds:
      - task: _require-cluster
      - |
        eval "$(bash scripts/llm-env.sh --export)"
        if ! grep -qx vertex .k3d/llm/sources 2>/dev/null; then
            echo "Vertex AI is not enabled. Set LLM_VERTEX_ACCOUNT and LLM_VERTEX_PROJECT in .env and run: task llm-enable" >&2
            exit 1
        fi
        if [ -z "${LLM_VERTEX_ACCOUNT:-}" ]; then
            echo "LLM_VERTEX_ACCOUNT is not set in .env" >&2
            exit 1
        fi
      - task: _llm-guard-vertex
      - task: _llm-vertex-token

  deploy-phraseforge:
    desc: Build and deploy the phraseforge app to the running cluster.
    cmds:
      - task: _build-image
        vars:
          APP: phraseforge
      - task: _check-image-size
        vars:
          APP: phraseforge
      - task: _require-cluster
      - task: _apply-namespaces
      - task: _ensure-db-secret
      - '{{.KUBECTL}} apply -f phraseforge/k8s/configmap.yaml'
      - task: _ensure-phraseforge-models
      - task: _migrate-db
        vars:
          APP: phraseforge
          JOB_NAME: phraseforge-migrate
      - '{{.KUBECTL}} apply -f phraseforge/k8s/'
      - '{{.KUBECTL}} rollout restart deployment/phraseforge -n app'
      - '{{.KUBECTL}} rollout status deployment/phraseforge -n app --timeout=120s'
      - 'echo "phraseforge ready: http://phraseforge.localhost:{{.INGRESS_PORT}}"'

  delete-phraseforge:
    desc: Delete the phraseforge app from the running cluster.
    cmds:
      - task: _require-cluster
      - '{{.KUBECTL}} delete -f phraseforge/k8s/ --ignore-not-found'
      - '{{.KUBECTL}} delete configmap phraseforge-models -n app --ignore-not-found'

  # The models file is a ConfigMap built from phraseforge/models.dev.yaml, or from
  # the file `task llm-enable` generated, checked first (phraseforge shares the assistant's models schema) so a mistake in it
  # stops the deploy instead of the pod. The migrate Job and the Deployment both
  # mount it, so it is applied before either.
  _ensure-phraseforge-models:
    internal: true
    cmds:
      - |
        file="$PWD/phraseforge/models.dev.yaml"
        if [ -f .k3d/llm/phraseforge-models.yaml ]; then file="$PWD/.k3d/llm/phraseforge-models.yaml"; fi
        (cd assistant && go run . models validate "$file")
        {{.KUBECTL}} create configmap phraseforge-models \
            --from-file=models.yaml="$file" \
            --namespace=app \
            --dry-run=client -o yaml \
        | {{.KUBECTL}} apply -f -

  migrate-phraseforge-db:
    desc: Run the phraseforge database migration Job against the running cluster.
    cmds:
      - task: _migrate-db
        vars:
          APP: phraseforge
          JOB_NAME: phraseforge-migrate

  # Deletes any prior completed/failed Job first (Jobs are immutable once
  # created); each app's schema.sql/migrate step is itself idempotent, so a
  # second run applies nothing new.
  _migrate-db:
    internal: true
    requires:
      vars: [APP, JOB_NAME]
    cmds:
      - task: _require-cluster
      - '{{.KUBECTL}} delete job {{.JOB_NAME}} -n app --ignore-not-found'
      - '{{.KUBECTL}} apply -f {{.APP}}/k8s/jobs/migrate-job.yaml'
      - '{{.KUBECTL}} wait --for=condition=complete job/{{.JOB_NAME}} -n app --timeout=120s'
      - '{{.KUBECTL}} logs -n app -l job-name={{.JOB_NAME}} --tail=100'

  # ── Garage ───────────────────────────────────────────────────────────────────

  # Garage's S3 API refuses every request — even on a single node — until its
  # cluster layout has been assigned, which nothing does automatically.
  # Idempotent: skips the layout step if a role is already assigned, and skips
  # key creation if "dev-app" already exists (Garage never lets you retrieve a
  # secret key twice, so it's saved to .k3d/garage.env on first creation only).
  _init-garage:
    internal: true
    cmds:
      - task: _require-cluster
      - |
        # /garage, not "garage": the image is shell-less with no $PATH lookup;
        # the binary is the container's own ENTRYPOINT at this absolute path.
        exec_garage() { {{.KUBECTL}} exec -n data deploy/garage -- /garage "$@"; }

        status_output="$(exec_garage status)"
        echo "$status_output"

        if echo "$status_output" | grep -q "NO ROLE ASSIGNED"; then
            node_id="$(echo "$status_output" | awk '/NO ROLE ASSIGNED/{print $1; exit}')"
            echo "Assigning node ${node_id} to the layout (zone=dev, capacity=1G)..."
            exec_garage layout assign -z dev -c 1G "$node_id"
            exec_garage layout apply --version 1
        else
            echo "A node already has a layout role assigned; skipping."
        fi

        if exec_garage bucket list | grep -Eq '(^|[[:space:]])dev([[:space:]]|$)'; then
            echo "Bucket 'dev' already exists."
        else
            exec_garage bucket create dev
        fi

        if exec_garage key list | grep -Eq '(^|[[:space:]])dev-app([[:space:]]|$)'; then
            if [ -f .k3d/garage.env ]; then
                echo "Key 'dev-app' already exists; credentials are in .k3d/garage.env."
            else
                echo "ERROR: key 'dev-app' exists in Garage but .k3d/garage.env is missing locally." >&2
                echo "Garage never lets you retrieve a secret key after creation. Either restore" >&2
                echo ".k3d/garage.env from backup, or delete the key and rerun this task:" >&2
                echo "  task run-k8s -- exec -n data deploy/garage -- /garage key delete dev-app" >&2
                exit 1
            fi
        else
            key_output="$(exec_garage key create dev-app)"
            echo "$key_output"
            key_id="$(echo "$key_output" | awk '/^Key ID:/{print $NF}')"
            secret_key="$(echo "$key_output" | awk '/^Secret key:/{print $NF}')"
            exec_garage bucket allow --read --write dev --key dev-app
            {
                echo "GARAGE_KEY_ID=${key_id}"
                echo "GARAGE_SECRET_KEY=${secret_key}"
                echo "GARAGE_BUCKET=dev"
                echo "GARAGE_S3_REGION=garage"
                echo "GARAGE_S3_ENDPOINT=http://garage.localhost:{{.INGRESS_PORT}}"
            } > .k3d/garage.env
            echo "Credentials written to .k3d/garage.env (gitignored)."
        fi
        echo "Garage ready. Credentials and endpoint: .k3d/garage.env"

  # ── Argo Workflows + Argo Events ─────────────────────────────────────────────

  # Argo Workflows' own namespaced install manifest (CRDs, RBAC, controller,
  # server) is ~12 MB — almost entirely CRD OpenAPI schemas — so unlike the
  # other shared infra above it isn't vendored into this repo. Downloaded once
  # per pinned version into .k3d/ (gitignored); the status check skips
  # re-downloading once it's already there — bump ARGO_WORKFLOWS_VERSION above
  # and it re-downloads automatically, since the cache path is versioned.
  _ensure-argo-workflows-manifest:
    internal: true
    status:
      - test -s {{.ARGO_WORKFLOWS_MANIFEST}}
    cmds:
      - mkdir -p .k3d
      - echo "Downloading Argo Workflows {{.ARGO_WORKFLOWS_VERSION}} manifest..."
      - |
        tmp={{.ARGO_WORKFLOWS_MANIFEST}}.tmp
        url="https://github.com/argoproj/argo-workflows/releases/download/{{.ARGO_WORKFLOWS_VERSION}}/namespace-install.yaml"
        if ! curl -fsSL "$url" -o "$tmp"; then
            rm -f "$tmp"
            echo "Error: failed to download $url" >&2
            echo "Check network access (corporate TLS inspection can block this on some" >&2
            echo "hosts) and retry, or place the file manually at {{.ARGO_WORKFLOWS_MANIFEST}}." >&2
            exit 1
        fi
        mv "$tmp" {{.ARGO_WORKFLOWS_MANIFEST}}

  deploy-workflows:
    desc: Deploy Argo Workflows, Argo Events, and workflows/*.yaml to the running cluster, with a webhook wired to run the "hello" WorkflowTemplate.
    cmds:
      - task: _require-cluster
      - task: _ensure-argo-workflows-manifest
      - task: _apply-namespaces
      # --server-side: several of these CRDs (Workflow, WorkflowTemplate, ...) embed a
      # large enough OpenAPI schema that client-side apply's last-applied-configuration
      # annotation exceeds Kubernetes' 262144-byte annotation limit.
      - '{{.KUBECTL}} apply --server-side --force-conflicts -n workflows -f {{.ARGO_WORKFLOWS_MANIFEST}}'
      - '{{.KUBECTL}} apply -f k8s/40-argo-events.yaml -f k8s/41-argo-workflows-setup.yaml'
      - '{{.KUBECTL}} apply -f workflows/'
      # argo-server's upstream defaults require per-user auth and serve HTTPS;
      # replace both with a no-login, plain-HTTP setup (matching this cluster's
      # no-auth-for-dev-tools posture) — a "replace", not "add", so it's safe
      # to rerun even after argo-server's args already carry the patch.
      - |
        {{.KUBECTL}} patch deployment argo-server -n workflows --type=json -p='
          [
            {"op": "replace", "path": "/spec/template/spec/containers/0/args", "value": ["server", "--namespaced", "--auth-mode=server", "--secure=false"]},
            {"op": "replace", "path": "/spec/template/spec/containers/0/readinessProbe/httpGet/scheme", "value": "HTTP"}
          ]'
      - '{{.KUBECTL}} rollout status deployment/workflow-controller -n workflows --timeout=120s'
      - '{{.KUBECTL}} rollout status deployment/argo-server -n workflows --timeout=120s'
      - '{{.KUBECTL}} rollout status deployment/controller-manager -n workflows --timeout=120s'
      - '{{.KUBECTL}} apply -f k8s/42-argo-workflows-webhook.yaml'
      - 'echo "argo-workflows UI: http://argo.localhost:{{.INGRESS_PORT}}"'
      - 'echo "webhook (runs the hello WorkflowTemplate): see workflows/README.md"'

  delete-workflows:
    desc: Delete Argo Workflows and Argo Events from the running cluster.
    cmds:
      - task: _require-cluster
      - '{{.KUBECTL}} delete -f k8s/42-argo-workflows-webhook.yaml -f k8s/41-argo-workflows-setup.yaml -f k8s/40-argo-events.yaml --ignore-not-found'
      # Before the manifest below removes the WorkflowTemplate CRD itself.
      - '{{.KUBECTL}} delete -f workflows/ --ignore-not-found'
      - |
        if [ -s {{.ARGO_WORKFLOWS_MANIFEST}} ]; then
            {{.KUBECTL}} delete -n workflows -f {{.ARGO_WORKFLOWS_MANIFEST}} --ignore-not-found
        else
            echo "Warning: {{.ARGO_WORKFLOWS_MANIFEST}} not found locally; skipping deletion of the Argo Workflows controller/CRDs/RBAC." >&2
            echo "Run 'task deploy-workflows' once to re-fetch it, then 'task delete-workflows' again — or delete the 'workflows' namespace's contents manually." >&2
        fi
